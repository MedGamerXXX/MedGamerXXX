      { id: 'c2_46', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '9. Arritmias Ventriculares (P45–48)', left: '¿Cuáles son las características diagnósticas en ECG de cada tipo de arritmia ventricular?', right: 'Extrasístoles ventriculares: complejos QRS prematuros y anchos (≥ 120 ms), seguidos de pausa compensatoria completa. TV no sostenida: ≥ 3 latidos ventriculares consecutivos, FC > 100 lpm y duración < 30 segundos. TV sostenida: duración > 30 segundos o produce compromiso hemodinámico o requiere intervención (monomórfica, polimórfica o bidireccional; pistas: disociación AV e inicio con extrasístoles). Fibrilación ventricular: actividad eléctrica desorganizada y caótica sin contracción efectiva.' },
      { id: 'c2_47', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '9. Arritmias Ventriculares (P45–48)', left: '¿Qué estudios complementarios y de estratificación de riesgo se usan en arritmias ventriculares?', right: 'ECG de 12 derivaciones, Holter/monitoreo ambulatorio prolongado, ecocardiografía y resonancia magnética cardíaca (detectan cicatrices o displasia del ventrículo derecho), pruebas genéticas, estudio electrofisiológico y medición de FEVI (FEVI < 35% = indicador de riesgo elevado para muerte súbita cardíaca).' },
      { id: 'c2_48', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '9. Arritmias Ventriculares (P45–48)', left: '¿Cuál es el manejo agudo y crónico de las arritmias ventriculares y de la Torsades de pointes?', right: 'TV inestable (con pulso): cardioversión eléctrica sincronizada. TV monomórfica estable: procainamida, amiodarona o lidocaína. Torsades de pointes: suspender fármacos que prolongan QT y corregir hipocalemia/hipomagnesemia; magnesio IV de elección (independiente de niveles séricos); desfibrilación NO sincronizada si inestable; isoproterenol o marcapasos si recurrente. Prevención a largo plazo: desfibrilador automático implantable (DAI) como pilar en alto riesgo (FEVI < 35%, miocardiopatías o FV idiopática) + betabloqueadores adyuvantes o ablación con catéter.' },

      // ==================== CARDIOLOGÍA 2 — MÓDULO II: VALVULOPATÍAS (49–79) ====================
      // 1. Generalidades Valvulares y Cuadro Rápido de Soplos por Foco (Preguntas 49–50)
      { id: 'c2_49', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '1. Generalidades y Soplos por Foco (P49–50)', left: '¿Cuál es la diferencia fisiopatológica general entre estenosis e insuficiencia valvular?', right: 'Estenosis: restricción al flujo → sobrecarga de PRESIÓN → HIPERTROFIA. Insuficiencia: reflujo / sobrecarga de VOLUMEN → DILATACIÓN.' },
      { id: 'c2_50', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '1. Generalidades y Soplos por Foco (P49–50)', left: '¿Qué soplos sistólicos y diastólicos corresponden a cada uno de los 4 focos de auscultación clásica?', right: 'Foco aórtico: Sístole = Estenosis aórtica | Diástole = Insuficiencia aórtica. Foco pulmonar: Sístole = Estenosis pulmonar | Diástole = Insuficiencia pulmonar. Foco tricuspídeo: Sístole = Insuficiencia tricuspídea | Diástole = Estenosis tricuspídea + insuficiencia tricuspídea. Foco mitral: Sístole = Insuficiencia mitral | Diástole = Estenosis mitral.' },

      // 2. Estenosis Aórtica (EA) (Preguntas 51–62)
      { id: 'c2_51', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '2. Estenosis Aórtica (EA) (P51–62)', left: '¿Cuál es el área valvular aórtica normal y qué importancia epidemiológica tiene la estenosis aórtica (EA)?', right: 'El área normal es de 3 a 4 cm². Es la valvulopatía primaria que con mayor frecuencia requiere tratamiento quirúrgico o percutáneo en Europa y Norteamérica, y en México representa la primera causa de obstrucción al flujo de salida del ventrículo izquierdo (VI), con patrón progresivo y evolución silente durante largos periodos.' },
      { id: 'c2_52', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '2. Estenosis Aórtica (EA) (P51–62)', left: '¿Cuál es la tasa de progresión natural anual y los 6 predictores de progresión rápida de la EA?', right: 'Progresión anual: reducción del área valvular de 0.1 a 0.3 cm²/año e incremento del gradiente medio transvalvular de 5 a 11 mmHg/año. 6 factores predictores de progresión rápida: edad avanzada, enfermedad renal crónica, enfermedad coronaria, disfunción sistólica, válvula bicúspide y calcificación valvular severa.' },
      { id: 'c2_53', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '2. Estenosis Aórtica (EA) (P51–62)', left: '¿Cuáles son las etiologías de la EA valvular según el grupo de edad?', right: '0–30 años (recién nacido): válvula unicúspide. 30–70 años (adulto joven): válvula bicúspide (la más común en adultos jóvenes; hasta 50% de adultos con EA crítica) o válvula tricúspide malformada. Adulto joven: EA reumática (fiebre reumática por estreptococo betahemolítico grupo A; fusión comisural con lesión mitral). > 70 años (adultos mayores): EA degenerativa calcificada (la más frecuente en mayores; esclerosis y calcio sobre válvula tricúspide asociada a HTA, dislipidemia, DM y enfermedad coronaria).' },
      { id: 'c2_54', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '2. Estenosis Aórtica (EA) (P51–62)', left: '¿Qué caracteriza a las formas subvalvular y supravalvular de la EA?', right: 'Subvalvular: causada por membranas o rodete fibroso, o por miocardiopatía hipertrófica obstructiva. Supravalvular (poco común): asociada al síndrome de Williams-Beuren (hipercalcemia, facies característica y discapacidad intelectual; perla: Williams = SUPRAvalvular).' },
      { id: 'c2_55', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '2. Estenosis Aórtica (EA) (P51–62)', left: '¿Cuál es la secuencia fisiopatológica de la EA y qué pasa si progresa sin tratamiento?', right: 'Disminución del área valvular → obstrucción fija al vaciamiento/salida del VI → aumento de la presión intraventricular izquierda → sobrecarga de presión crónica e hipertrofia concéntrica del VI → disfunción diastólica y, en fases avanzadas, disfunción sistólica. Sin tratamiento lleva a compromiso multiorgánico (pulmonar, hepático y renal) y muerte prematura.' },
      { id: 'c2_56', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '2. Estenosis Aórtica (EA) (P51–62)', left: '¿Cuál es la tríada clínica clásica (SAD) de la EA avanzada y qué pronóstico tiene sin recambio valvular?', right: 'Tríada clásica (SAD — indicación formal de intervención): Síncope (~3 años de supervivencia), Angina (~5 años) y Disnea (~2 años; al esfuerzo puede progresar a IC); muerte súbita = 3–3.4% (en series globales 5 a 34%, más común en sintomáticos).' },
      { id: 'c2_57', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '2. Estenosis Aórtica (EA) (P51–62)', left: '¿Cuáles son los hallazgos físicos, razones de verosimilitud (LR) y el fenómeno de Gallavardin en la EA?', right: 'Soplo mesosistólico in crescendo-decrescendo en 2.º espacio intercostal derecho (foco aórtico) irradiado a cuello y carótidas (+LR: 8.1; ausencia -LR: 0.1). Frémito palpable. Fenómeno de Gallavardin (irradiación del soplo hacia el ápex). Pulso parvus et tardus (tardus +LR: 6.8, parvus +LR: 2). Segundo ruido S2 disminuido (+LR: 7.5). Combinación ≥ 3 hallazgos (+LR: 40). Pulso carotídeo muy disminuido = menor supervivencia a 2 años (65% vs. 89%).' },
      { id: 'c2_58', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '2. Estenosis Aórtica (EA) (P51–62)', left: '¿Cuál es el estudio diagnóstico clave, la Regla ENARM y los criterios ecocardiográficos de severidad (leve, moderada y severa) de la EA?', right: 'Estudio clave: ecocardiograma transtorácico (ETT). Regla ENARM (4–40–1): Vmax ≥ 4.0 m/s (> 4 m/s), gradiente medio ≥ 40 mmHg (> 40 mmHg) y área valvular ≤ 1.0 cm² (o ≤ 0.6 cm²/m² SC). Leve: área > 1.5 cm², Vmax < 3 m/s, gradiente < 20 mmHg. Moderada: área 1.0–1.5 cm², Vmax 3–4 m/s, gradiente 20–40 mmHg. Severa: área ≤ 1.0 cm², Vmax > 4 m/s, gradiente > 40 mmHg.' },
      { id: 'c2_59', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '2. Estenosis Aórtica (EA) (P51–62)', left: '¿Cuáles son las 4 categorías hemodinámicas de la EA y qué estudios complementarios requieren?', right: '1) EA de gradiente alto: gradiente > 40 mmHg, Vmax ≥ 4.0 m/s, área ≤ 1.0 cm². 2) EA con flujo y gradiente bajos con FEVI reducida (< 50%, IVL ≤ 35 ml/m²): requiere ecocardiografía con dobutamina para distinguir EA verdadera de pseudograve. 3) EA con flujo y gradiente bajos con FEVI conservada (≥ 50%, IVL ≤ 35 ml/m², ancianos hipertensos): requiere cuantificación de calcio por TC (hombres > 2,000, mujeres > 1,200 unidades Agatston). 4) EA con flujo normal, gradiente bajo y FEVI conservada (IVL > 35 ml/m²): habitualmente EA moderada.' },
      { id: 'c2_60', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '2. Estenosis Aórtica (EA) (P51–62)', left: '¿Cuál es el algoritmo diagnóstico y las indicaciones de intervención en pacientes sintomáticos y asintomáticos con EA?', right: 'Vmax < 2.5 m/s → seguimiento; Vmax 2.5–4 m/s con área > 1.5 cm² → seguimiento; área 1.0–1.5 cm² → valorar síntomas y prueba de esfuerzo; área ≤ 1.0 cm² → EA severa. Sintomáticos con EA grave: todos deben considerarse para intervención (salvo fragilidad marcada o expectativa de vida limitada). Asintomáticos con EA grave: intervención si FEVI < 50%; si FEVI ≥ 50%, prueba de esfuerzo (síntomas o caída sostenida de PA indica intervención; si no, seguimiento cada 6–12 meses).' },
      { id: 'c2_61', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '2. Estenosis Aórtica (EA) (P51–62)', left: '¿Cómo decide el Heart Team entre reemplazo quirúrgico (RQVA) e implante percutáneo (TAVI)?', right: 'Evaluando edad, riesgo quirúrgico (STS Score o EuroSCORE II), anatomía, comorbilidades y accesos vasculares: RQVA en < 75 años, riesgo quirúrgico bajo (STS o EuroSCORE II < 4%) y sin contraindicación quirúrgica. TAVI transfemoral en > 75 años, alto riesgo quirúrgico (STS o EuroSCORE II > 8%) o no candidatos a cirugía. Decisión individualizada en rango intermedio.' },
      { id: 'c2_62', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '2. Estenosis Aórtica (EA) (P51–62)', left: '¿Cuál es el seguimiento, manejo médico, complicación post-TAVI, prevención y profilaxis de endocarditis (Cuadro 23) en la EA?', right: 'Seguimiento ETT: grave asintomática cada 6 meses, moderada anual, leve cada 2–3 años. Médico: ningún fármaco frena progresión; en HTA usar IECA, ARA-II o betabloqueadores con vigilancia de hipotensión. Post-TAVI vigilar riesgo de bloqueo AV. Prevenir evitando subvaloración en mujeres. Profilaxis endocarditis (Cuadro 23): dentales → amoxicilina 3 g 1 h antes y 1.5 g 6 h después (alergia: eritromicina 1 g / 0.5 g); dentales alto riesgo → ampicilina 2 g + gentamicina 1.5 mg/kg IV/IM 30 min antes (alergia: vancomicina 1 g IV 1 h antes); cirugía GI/GU → gentamicina 1.5 mg/kg IM o IV.' },

      // 3. Insuficiencia Aórtica (IA) (Preguntas 63–68)
      { id: 'c2_63', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '3. Insuficiencia Aórtica (IA) (P63–68)', left: '¿Qué es la insuficiencia aórtica (IA), cuál es su epidemiología y sus etiologías (con porcentajes)?', right: 'Cierre inadecuado de las valvas aórticas en diástole con regurgitación hacia el VI, generando sobrecarga de volumen y dilatación del VI. Epidemiología (Framingham): detectable por Doppler en ≥ 13% de hombres y 8.5% de mujeres, aumenta > 50 años y más común en hombres. Etiologías: degenerativa/válvula bicúspide/envejecimiento 50–60%; endocarditis infecciosa 10–15% (principal causa de IA aguda grave, seguida por disección aórtica); fiebre reumática (regiones en desarrollo); enfermedades del tejido conectivo (síndrome de Marfan).' },
      { id: 'c2_64', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '3. Insuficiencia Aórtica (IA) (P63–68)', left: '¿Cuáles son los 3 tipos fisiopatológicos de regurgitación aórtica?', right: 'Tipo 1: cúspides normales con coaptación insuficiente por dilatación de la raíz aórtica → chorro central. Tipo 2: prolapso de cúspides → chorro excéntrico. Tipo 3: retracción valvular → chorro excéntrico/variable según retracción.' },
      { id: 'c2_65', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '3. Insuficiencia Aórtica (IA) (P63–68)', left: '¿Cuál es el cuadro clínico y los signos físicos característicos (con LR) de la insuficiencia aórtica?', right: 'Clínica: larga fase asintomática; luego disnea de esfuerzo, ortopnea, edema pulmonar, palpitaciones, angina nocturna y latidos fuertes o "golpes" en el pecho en supino. Física: soplo diastólico temprano decreciente de alta frecuencia en foco aórtico/borde esternal izquierdo (+LR: 9.9, ausencia -LR: 0.1); presión diastólica < 50 mmHg (+LR: 19.3); gradiente poplíteo-braquial > 20 mmHg (+LR: 8.2); S3 (+LR: 5.9, FEVI < 50% +LR: 8.3); impulso apical sostenido (+LR: 2.4); pulso de Corrigan ("martillo de agua"), signo de Musset, signo de Quincke y soplo de Austin Flint en ápex.' },
      { id: 'c2_66', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '3. Insuficiencia Aórtica (IA) (P63–68)', left: '¿Qué hallazgos ofrecen el ECG, ETT (5 criterios de gravedad), RMC y TC de alta resolución en la IA?', right: 'ECG: hipertrofia ventricular izquierda. ETT (5 criterios de IA grave): 1) Vena contracta > 6 mm, 2) AORE ≥ 30 mm², 3) Volumen regurgitante ≥ 60 mL/latido, 4) Flujo holodiastólico invertido en aorta descendente y 5) Tiempo de hemipresión < 200 ms. RMC: cuantifica fracción regurgitante y volumen del VI en discordancia. TC de alta resolución: mide diámetro máximo de la aorta en 4 niveles (anillo, senos de Valsalva, unión sinotubular y aorta ascendente tubular).' },
      { id: 'c2_67', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '3. Insuficiencia Aórtica (IA) (P63–68)', left: '¿Cómo se realiza la vigilancia ecocardiográfica y cuáles son las indicaciones de cirugía en la IA?', right: 'Vigilancia en asintomáticos con IA grave, FEVI > 50% y DTSVI < 50 mm: ETT anual si hay dilatación significativa; cada 6 meses si el DTSVI se aproxima al umbral quirúrgico. 3 pilares de indicación quirúrgica: 1) Dilatación significativa de la aorta ascendente (incluso sin IA grave), 2) Sintomáticos con IA grave (todo sintomático), 3) Asintomáticos con IA grave si FEVI ≤ 50%, DTSVI > 50 mm (o > 25 mm/m² SC) o dilatación progresiva significativa.' },
      { id: 'c2_68', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '3. Insuficiencia Aórtica (IA) (P63–68)', left: '¿Cuál es el tratamiento médico y las medidas preventivas en la insuficiencia aórtica?', right: 'Tratamiento médico (disfunción postquirúrgica o no candidatos quirúrgicos): IECA o ARA-II (reducen poscarga), betabloqueadores (de elección en síndrome de Marfan para enlentecer la dilatación aórtica) y diuréticos. Prevención: cribado de familiares de primer grado cuando hay válvula bicúspide o enfermedades del tejido conectivo, y seguimiento ecocardiográfico periódico en asintomáticos con IA grave y FEVI preservada.' },

      // 4. Estenosis Mitral (EM) (Preguntas 69–74)
      { id: 'c2_69', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '4. Estenosis Mitral (EM) (P69–74)', left: '¿Qué es la estenosis mitral (EM), qué cavidades afecta y cuáles son sus perlas fisiopatológicas?', right: 'Estrechamiento valvular que obstruye el flujo de la aurícula izquierda (AI) al ventrículo izquierdo (VI), elevando la presión en AI, vasculatura pulmonar y lado derecho del corazón, mientras el VI permanece sin afección en la EM aislada ("Mitral estrecha = AI se atora, pulmón se congestiona" y "AI grande = FA"). Secuencia: ↑ presión AI → hipertensión venocapilar y congestión pulmonar → hipertensión arterial pulmonar → sobrecarga/falla de VD + dilatación de AI.' },
      { id: 'c2_70', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '4. Estenosis Mitral (EM) (P69–74)', left: '¿Cuáles son las etiologías reumática y no reumática de la EM y qué utilidad tienen los criterios de Jones?', right: 'Reumática (principal): secuela de fiebre reumática por Streptococcus pyogenes (estreptococo betahemolítico grupo A); produce fusión comisural, engrosamiento y calcificación de cuerdas tendinosas y "válvula en boca de pescado". No reumática: calcificación degenerativa del anillo/valva en adultos mayores. Criterios de Jones: útiles para antecedente o diagnóstico de fiebre reumática, NO para diagnosticar estenosis mitral.' },
      { id: 'c2_71', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '4. Estenosis Mitral (EM) (P69–74)', left: '¿Cuáles son los síntomas, complicaciones y el Síndrome de Ortner en la estenosis mitral?', right: 'Síntomas: disnea de esfuerzo (más frecuente, hasta en 70%), ortopnea, disnea paroxística nocturna (DPN), edema pulmonar, fatiga, palpitaciones, hemoptisis, dolor torácico y disfonía (Síndrome de Ortner). Complicaciones: fibrilación auricular (30–40% general y hasta 70% en hospitalizados), tromboembolismo sistémico, hipertensión pulmonar, falla de VD, edema pulmonar agudo e infecciones respiratorias recurrentes. Síndrome de Ortner: disfonía por compresión del nervio laríngeo recurrente izquierdo secundaria a dilatación de AI e hipertensión pulmonar.' },
      { id: 'c2_72', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '4. Estenosis Mitral (EM) (P69–74)', left: '¿Qué hallazgos se observan en la exploración física general, pulso arterial/venoso y auscultación (Ritmo de Duroziez) de la EM?', right: 'Inspección: facies mitral (manchas rosadas/violáceas en mejillas), estertores y signos de IC derecha. Pulsos: onda "a" venosa yugular prominente en ritmo sinusal (desaparece en FA predominando "v"). Ritmo de Duroziez (ápex, decúbito lateral izquierdo y espiración): 1) S1 acentuado, 2) Sístole limpia, 3) Chasquido de apertura mitral (SO) posterior a S2 (intervalo A2-SO más corto a mayor presión en AI) y 4) Retumbo diastólico de tono bajo con refuerzo presistólico (se pierde en FA). Soplos asociados: insuficiencia tricuspídea o Graham Steell.' },
      { id: 'c2_73', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '4. Estenosis Mitral (EM) (P69–74)', left: '¿Qué hallazgos ofrecen la Rx de tórax, ECG, prueba de esfuerzo, ETT/ETE e índice de Wilkins en la EM?', right: 'Rx tórax: crecimiento de AI con imagen en "4 arcos". ECG: onda P ancha y mellada > 120 ms y FA (30–40%). ETT/ETE (estudio clave): fusión comisural, apertura en domo, AVM por planimetría ≤ 1.5 cm² (muy grave ≤ 1.0 cm²), PHT ≥ 150 ms (muy severa ≥ 220 ms) y gradiente medio ≥ 10 mmHg. Índice de Wilkins (movilidad, engrosamiento, calcificación y afectación subvalvular; 1–4 pts c/u): puntaje ≤ 8 = morfología favorable para valvuloplastía con balón.' },
      { id: 'c2_74', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '4. Estenosis Mitral (EM) (P69–74)', left: '¿Cuál es el tratamiento médico, indicaciones de intervención, algoritmo de conducta, seguimiento y profilaxis de la EM?', right: 'Médico: betabloqueadores o digoxina, anticoagulación con antagonistas de vitamina K (warfarina/acenocumarina, INR 2.0–3.5) en FA/trombo/embolia, diuréticos y penicilina benzatínica IM c/3–4 semanas en fiebre reumática. 5 indicaciones de intervención: 1) Síntomas NYHA II–IV, 2) Área ≤ 1.5 cm², 3) PSAP ≥ 50 mmHg, 4) Embolia sistémica y 5) Gradiente medio ≥ 10 mmHg. Anatomía favorable (Wilkins ≤ 8, sin trombos ni IM mod-sev) → valvuloplastía mitral percutánea con balón; no favorable → cirugía mitral. ETT anual en severa asintomática.' },

      // 5. Insuficiencia Mitral (IM) (Preguntas 75–79)
      { id: 'c2_75', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '5. Insuficiencia Mitral (IM) (P75–79)', left: '¿Qué es la insuficiencia mitral (IM), cómo se divide (primaria vs. secundaria) y cuáles son sus etiologías (con porcentajes)?', right: 'Falta de coaptación adecuada de las valvas mitrales en sístole con flujo retrógrado del VI a la AI, generando sobrecarga de volumen de AI y VI con dilatación de AI (más frecuente en mujeres). Primaria: daño estructural valvular; Secundaria: disfunción funcional del miocardio (isquémica). Etiologías: degeneración/prolapso mitral/mixomatosis 50–70%; isquemia/IAM 20–30% (ruptura de cuerdas o músculos papilares da IM aguda grave); fiebre/cardiopatía reumática 15–20%; endocarditis infecciosa y tejido conectivo (lupus, artritis reumatoide).' },
      { id: 'c2_76', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '5. Insuficiencia Mitral (IM) (P75–79)', left: '¿En qué se diferencia la fisiopatología y el cuadro clínico de la IM crónica frente a la IM aguda?', right: 'IM crónica: sobrecarga mantenida de volumen → dilatación progresiva de AI y VI → elevación de presiones pulmonares y disfunción del VI; tras años asintomática produce disnea progresiva, ortopnea, fatiga, palpitaciones y menor tolerancia al ejercicio. IM aguda: aumento súbito de presión en AI y venas pulmonares (sin adaptación) → hipertensión venosa pulmonar aguda, edema pulmonar severo, disnea súbita, hipoxia, hipotensión, bajo gasto y choque cardiogénico.' },
      { id: 'c2_77', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '5. Insuficiencia Mitral (IM) (P75–79)', left: '¿Cuál es el hallazgo auscultatorio clásico de la IM y qué sensibilidad y razones de verosimilitud (LR) tiene el examen físico?', right: 'Soplo holosistólico de alta frecuencia, carácter de "chorro de vapor", mejor auscultado en el ápex con irradiación hacia la axila (+LR: 6.8 si alcanza línea axilar anterior); intensidad grado 4–5/6 sugiere IM grave (+LR: 14), grado 1–2/6 la aleja (-LR: 0.19); su ausencia NO excluye IM (-LR: 0.66, puede faltar en IM aguda). S2 acentuado (+LR: 4.7), S3 y ápex desplazado/hipercinético (+LR: 11.2). Sensibilidad global ~88%.' },
      { id: 'c2_78', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '5. Insuficiencia Mitral (IM) (P75–79)', left: '¿Cuál es el estudio diagnóstico clave, los 6 parámetros ecocardiográficos de gravedad y cuándo usar ETE, esfuerzo o cateterismo en la IM?', right: 'Estudio clave: ETT. 6 parámetros de gravedad: 1) EROA ≥ 0.40 cm², 2) Volumen regurgitante (VR) ≥ 60 mL/latido, 3) Fracción regurgitante (FR) > 50%, 4) FEVI anormal si < 60%, 5) DSFVI patológico si ≥ 45 mm y 6) PSAP patológica si > 50 mmHg en reposo o > 60 mmHg con esfuerzo. ETE: mala ventana, inestabilidad, endocarditis o prequirúrgico. Prueba de esfuerzo con protocolo de Naughton: capacidad funcional y momento quirúrgico. ETT anual en severa asintomática (o c/6 meses si progresa).' },
      { id: 'c2_79', mission: 'C2', topic: 'Módulo II: Valvulopatías', cat: '5. Insuficiencia Mitral (IM) (P75–79)', left: '¿Cuál es el tratamiento médico de la IM aguda y crónica, las indicaciones quirúrgicas, pronóstico, referencia y prevención?', right: 'IM aguda: vasodilatadores (nitroprusiato de sodio o nicardipina), balón de contrapulsación intraaórtico si inestable, antibióticos + cirugía temprana en endocarditis. IM crónica: en primaria con FEVI < 60% usar betabloqueadores, IECA/ARA-II y antagonistas de aldosterona, diuréticos y anticoagulación si FA (NO fármacos en asintomáticos con FEVI preservada). Cirugía (técnica de elección: reparación valvular sobre reemplazo): sintomáticos con IM grave, o asintomáticos con FEVI ≤ 60%, DSFVI ≥ 45 mm, aparición de FA, PSAP > 50 mmHg en reposo o dilatación severa de AI.' }
    ];

    const game = {
      xp: 0,
      mastered: [],
      mistakes: [],
      selectedMission: 'C1',
      selectedTopic: 'ALL',
      currentCat: null,

      ankiDeck: [],
      ankiIndex: 0,
      ankiFlipped: false,

      matchPairs: [],
      matchLeftOrder: [],
      matchRightOrder: [],
      matchSelLeft: null,
      matchMatchedIds: [],
      matchCombo: 0,
      matchErrorFlash: false,

      memoCards: [],
      memoFlipped: [],
      memoMatched: [],
      memoMoves: 0,
      memoLocked: false,

      canvas: null,
      ctx: null,
      rafId: null,
      shooterActive: false,
      shooterSpeed: 'comfortable',
      shooterQueue: [],
      shooterIndex: 0,
      shield: 100,
      enemy: null,
      turrets: [],
      lasers: [],
      particles: [],
      stars: [],
      feedbackMsg: '',
      feedbackColor: '#22d3ee',
      feedbackTimer: 0,

      bossName: '',
      bossHp: 100,
      bossMaxHp: 100,
      playerHp: 100,
      bossQueue: [],
      bossIdx: 0,
      bossOptions: [],
      bossAnswered: false,
      bossLog: '',
      bossTimer: 20,
      bossTimerId: null,

      init() {
        try {
          const saved = JSON.parse(localStorage.getItem('cardiodefensa_cardio1_v2') || '{}');
          if (typeof saved.xp === 'number') this.xp = saved.xp;
          if (Array.isArray(saved.mastered)) this.mastered = saved.mastered;
          if (Array.isArray(saved.mistakes)) this.mistakes = saved.mistakes;
        } catch (e) {}

        try {
          const params = new URLSearchParams(window.location.search);
          const m = (params.get('mision') || params.get('modulo') || '').toUpperCase();
          if (m === 'C2' || m === '2') this.selectedMission = 'C2';
          else if (m === 'C1' || m === '1') this.selectedMission = 'C1';
        } catch (e) {}

        this.updateHUD();
        this.showMenu();
      },

      saveProgress() {
        try {
          localStorage.setItem('cardiodefensa_cardio1_v2', JSON.stringify({
            xp: this.xp,
            mastered: this.mastered,
            mistakes: this.mistakes
          }));
        } catch (e) {}
        this.updateHUD();
      },

      updateHUD() {
        const xpEl = document.getElementById('hud-xp');
        const mEl = document.getElementById('hud-mastered');
        const eEl = document.getElementById('hud-mistakes');
        if (xpEl) xpEl.textContent = this.xp;
        if (mEl) mEl.textContent = `${this.mastered.length}/${HAS_PAIRS.length}`;
        if (eEl) eEl.textContent = this.mistakes.length;
      },

      markMastered(id, bonus = 15) {
        if (!this.mastered.includes(id)) this.mastered.push(id);
        this.mistakes = this.mistakes.filter(m => m !== id);
        this.xp += bonus;
        this.saveProgress();
      },

      markMistake(id) {
        if (!this.mistakes.includes(id)) this.mistakes.push(id);
        this.saveProgress();
      },

      stopTimers() {
        this.shooterActive = false;
        if (this.rafId) {
          cancelAnimationFrame(this.rafId);
          this.rafId = null;
        }
        if (this.bossTimerId) {
          clearInterval(this.bossTimerId);
          this.bossTimerId = null;
        }
      },

      shuffle(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      },

      escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      },

      getPairsByCat(cat) {
        if (cat === 'ALL_MISTAKES') return HAS_PAIRS.filter(p => this.mistakes.includes(p.id));
        if (cat === 'ALL_CARDS') return [...HAS_PAIRS];
        return HAS_PAIRS.filter(p => p.cat === cat);
      },

      getDistractors(pair, count = 3) {
        let pool = HAS_PAIRS.filter(p => p.id !== pair.id && p.topic === pair.topic);
        if (pool.length < count) pool = HAS_PAIRS.filter(p => p.id !== pair.id);
        return this.shuffle(pool).slice(0, count);
      },

      selectMission(mission) {
        sfx.click();
        this.selectedMission = mission;
        this.selectedTopic = 'ALL';
        this.showMenu();
      },

      selectTopic(topic) {
        sfx.click();
        this.selectedTopic = topic;
        this.showMenu();
      },

      showMenu() {
        this.stopTimers();
        const root = document.getElementById('game-root');

        const c1Pairs = HAS_PAIRS.filter(p => (p.mission || 'C1') === 'C1');
        const c2Pairs = HAS_PAIRS.filter(p => p.mission === 'C2');
        const missionPairs = this.selectedMission === 'C1' ? c1Pairs : c2Pairs;

        const missionTopics = this.selectedMission === 'C1'
          ? ['ALL', '1. HAS', '2. Angina', '3. SCASEST', '4. IAMCEST']
          : ['ALL', 'Módulo I: Arritmias', 'Módulo II: Valvulopatías'];

        const topicLabels = {};
        missionTopics.forEach(t => {
          topicLabels[t] = t === 'ALL'
            ? `Todos (${missionPairs.length})`
            : `${t} (${missionPairs.filter(p => p.topic === t).length})`;
        });

        const visiblePairs = this.selectedTopic === 'ALL'
          ? missionPairs
          : missionPairs.filter(p => p.topic === this.selectedTopic);

        const cats = [...new Set(visiblePairs.map(p => p.cat))];
        const missionMastered = missionPairs.filter(p => this.mastered.includes(p.id)).length;
        const pctMission = missionPairs.length ? Math.round((missionMastered / missionPairs.length) * 100) : 0;

        const tabsHtml = missionTopics.map(t => {
          const active = this.selectedTopic === t;
          return `<button onclick="game.selectTopic('${t}')" class="btn-arcade px-3 py-2 rounded-xl text-xs font-arcade font-bold uppercase tracking-wide border ${
            active
              ? 'bg-cyan-500 text-slate-950 border-cyan-300'
              : 'bg-slate-900/90 text-slate-300 border-slate-700 hover:border-cyan-500/50'
          }">${topicLabels[t]}</button>`;
        }).join('');

        const cardsHtml = cats.map((cat, idx) => {
          const items = HAS_PAIRS.filter(p => p.cat === cat);
          const done = items.filter(p => this.mastered.includes(p.id)).length;
          const pct = Math.round((done / items.length) * 100);
          const safeCat = cat.replace(/'/g, "\\'");
          return `
            <div class="arcade-panel rounded-2xl p-4 flex flex-col justify-between gap-3 pop-in">
              <div>
                <div class="flex items-center justify-between gap-2 mb-1">
                  <span class="font-mono-code text-[11px] text-cyan-400 uppercase">${items[0].topic} • Nivel ${idx + 1}</span>
                  <span class="font-mono-code text-xs font-bold ${pct === 100 ? 'text-emerald-400' : 'text-slate-300'}">${done}/${items.length} (${pct}%)</span>
                </div>
                <h3 class="font-arcade text-base font-bold text-white leading-snug">${this.escapeHtml(cat)}</h3>
                <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden mt-2">
                  <div class="h-full bg-gradient-to-r from-cyan-400 to-emerald-400 transition-all duration-300" style="width:${pct}%"></div>
                </div>
              </div>
              <div class="grid grid-cols-5 gap-1.5 pt-1">
                <button onclick="game.startAnki('${safeCat}')" class="btn-arcade py-2 px-1 rounded-xl bg-indigo-500/20 hover:bg-indigo-500/35 border border-indigo-400/40 text-indigo-200 text-[11px] font-bold flex flex-col items-center gap-0.5">
                  <span>🃏</span><span>Anki</span>
                </button>
                <button onclick="game.startMatch('${safeCat}')" class="btn-arcade py-2 px-1 rounded-xl bg-amber-500/20 hover:bg-amber-500/35 border border-amber-400/40 text-amber-200 text-[11px] font-bold flex flex-col items-center gap-0.5">
                  <span>⚡</span><span>Pares</span>
                </button>
                <button onclick="game.startMemo('${safeCat}')" class="btn-arcade py-2 px-1 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/35 border border-emerald-400/40 text-emerald-200 text-[11px] font-bold flex flex-col items-center gap-0.5">
                  <span>🧠</span><span>Memo</span>
                </button>
                <button onclick="game.startShooter('${safeCat}')" class="btn-arcade py-2 px-1 rounded-xl bg-cyan-500/20 hover:bg-cyan-500/35 border border-cyan-400/40 text-cyan-200 text-[11px] font-bold flex flex-col items-center gap-0.5">
                  <span>🚀</span><span>Nave</span>
                </button>
                <button onclick="game.startBoss('${safeCat}')" class="btn-arcade py-2 px-1 rounded-xl bg-rose-500/20 hover:bg-rose-500/35 border border-rose-400/40 text-rose-200 text-[11px] font-bold flex flex-col items-center gap-0.5">
                  <span>👾</span><span>Jefe</span>
                </button>
              </div>
            </div>
          `;
        }).join('');

        const mistakesBanner = this.mistakes.length > 0 ? `
          <div class="arcade-panel rounded-2xl p-4 border-rose-500/40 flex flex-wrap items-center justify-between gap-3">
            <div>
              <p class="font-arcade text-sm font-bold text-rose-300 uppercase">Repaso de Fallos Pendientes (${this.mistakes.length})</p>
              <p class="text-xs text-slate-400">Refuerza únicamente las tarjetas que has fallado para dejarlas en verde.</p>
            </div>
            <div class="flex gap-2">
              <button onclick="game.startAnki('ALL_MISTAKES')" class="btn-arcade px-3 py-2 rounded-xl bg-rose-500/25 border border-rose-400/50 text-rose-200 text-xs font-bold">🃏 Repasar en Anki</button>
              <button onclick="game.startBoss('ALL_MISTAKES')" class="btn-arcade px-3 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold">👾 Jefe de Fallos</button>
            </div>
          </div>
        ` : '';

        root.innerHTML = `
          <div class="space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <button onclick="game.selectMission('C1')" class="btn-arcade p-4 rounded-2xl border text-left transition flex items-center justify-between ${
                this.selectedMission === 'C1'
                  ? 'bg-gradient-to-r from-cyan-500/25 to-emerald-500/20 border-cyan-400 text-white'
                  : 'bg-slate-900/80 border-slate-800 text-slate-400 hover:border-cyan-500/50'
              }">
                <div>
                  <div class="font-mono-code text-[11px] uppercase ${this.selectedMission === 'C1' ? 'text-cyan-300' : 'text-slate-500'}">Misión 1</div>
                  <div class="font-arcade text-lg font-bold uppercase">Cardiología 1</div>
                  <div class="text-xs opacity-80">HAS • Angina • SCASEST • IAMCEST</div>
                </div>
                <span class="font-mono-code text-xs px-2.5 py-1 rounded-lg bg-slate-950/70 border border-slate-700">${c1Pairs.length} tarjetas</span>
              </button>

              <button onclick="game.selectMission('C2')" class="btn-arcade p-4 rounded-2xl border text-left transition flex items-center justify-between ${
                this.selectedMission === 'C2'
                  ? 'bg-gradient-to-r from-purple-500/25 to-cyan-500/20 border-purple-400 text-white'
                  : 'bg-slate-900/80 border-slate-800 text-slate-400 hover:border-purple-500/50'
              }">
                <div>
                  <div class="font-mono-code text-[11px] uppercase ${this.selectedMission === 'C2' ? 'text-purple-300' : 'text-slate-500'}">Misión 2</div>
                  <div class="font-arcade text-lg font-bold uppercase">Cardiología 2</div>
                  <div class="text-xs opacity-80">Módulo I: Arritmias (48) • Módulo II: Valvulopatías (31)</div>
                </div>
                <span class="font-mono-code text-xs px-2.5 py-1 rounded-lg bg-slate-950/70 border border-slate-700">${c2Pairs.length} tarjetas</span>
              </button>
            </div>

            <div class="arcade-panel rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div class="space-y-1">
                <h2 class="font-arcade text-xl sm:text-2xl font-bold text-white uppercase">
                  ${this.selectedMission === 'C1' ? 'Misión 1: Cardiología 1' : 'Misión 2: Cardiología 2'}
                </h2>
                <p class="text-xs sm:text-sm text-slate-300">Domina las <strong>${missionPairs.length} tarjetas completas</strong> de esta misión en 5 modos interactivos: Anki, Conecta-Pares, Memorama, Navesita y Jefe Final.</p>
              </div>
              <div class="sm:w-56 shrink-0">
                <div class="flex justify-between font-mono-code text-xs mb-1">
                  <span class="text-slate-400">Progreso Misión</span>
                  <span class="text-emerald-400 font-bold">${missionMastered}/${missionPairs.length} (${pctMission}%)</span>
                </div>
                <div class="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-slate-700">
                  <div class="h-full bg-gradient-to-r from-cyan-400 to-emerald-400" style="width:${pctMission}%"></div>
                </div>
              </div>
            </div>

            ${mistakesBanner}

            <div class="flex flex-wrap gap-2">
              ${tabsHtml}
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${cardsHtml}
            </div>
          </div>
        `;
      },

      startAnki(cat) {
        sfx.click();
        this.stopTimers();
        this.currentCat = cat;
        this.ankiDeck = this.shuffle(this.getPairsByCat(cat));
        this.ankiIndex = 0;
        this.ankiFlipped = false;
        this.renderAnki();
      },

      renderAnki() {
        const root = document.getElementById('game-root');
        if (!this.ankiDeck.length) {
          this.showMenu();
          return;
        }
        if (this.ankiIndex >= this.ankiDeck.length) {
          root.innerHTML = `
            <div class="arcade-panel rounded-2xl p-8 text-center space-y-4 max-w-lg mx-auto pop-in">
              <div class="text-5xl">🏆</div>
              <h2 class="font-arcade text-2xl font-bold text-emerald-400 uppercase">¡Ronda Anki Completada!</h2>
              <p class="text-sm text-slate-300">Has repasado todas las tarjetas de <strong>${this.escapeHtml(this.currentCat)}</strong>.</p>
              <div class="flex flex-wrap justify-center gap-3 pt-2">
                <button onclick="game.startAnki('${this.currentCat.replace(/'/g, "\\'")}')" class="btn-arcade px-4 py-2.5 rounded-xl bg-indigo-500 text-white font-bold text-sm">Repetir Ronda</button>
                <button onclick="game.showMenu()" class="btn-arcade px-4 py-2.5 rounded-xl bg-slate-800 text-slate-200 font-bold text-sm">Volver al Menú</button>
              </div>
            </div>
          `;
          return;
        }

        const card = this.ankiDeck[this.ankiIndex];
        root.innerHTML = `
          <div class="max-w-2xl mx-auto w-full space-y-4 pop-in">
            <div class="flex items-center justify-between">
              <button onclick="game.showMenu()" class="btn-arcade px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">← Menú</button>
              <span class="font-mono-code text-xs text-cyan-400">${this.escapeHtml(card.cat)}</span>
              <span class="font-mono-code text-xs text-slate-400">Tarjeta ${this.ankiIndex + 1} / ${this.ankiDeck.length}</span>
            </div>

            <div onclick="game.flipAnki()" class="arcade-panel rounded-2xl p-6 sm:p-8 min-h-[280px] flex flex-col justify-between cursor-pointer border-indigo-500/40 hover:border-cyan-400/60 transition">
              <div class="flex justify-between items-center text-[11px] font-mono-code text-slate-400">
                <span>${this.ankiFlipped ? 'RESPUESTA CLÍNICA' : 'PREGUNTA'}</span>
                <span class="text-cyan-400">Toca para voltear</span>
              </div>

              <div class="my-6 space-y-4">
                <p class="text-lg sm:text-xl font-bold text-white leading-relaxed">${this.escapeHtml(card.left)}</p>
                ${this.ankiFlipped ? `
                  <div class="pt-4 border-t border-slate-700/80">
                    <p class="text-base sm:text-lg text-emerald-300 leading-relaxed font-medium">${this.escapeHtml(card.right)}</p>
                  </div>
                ` : `
                  <p class="text-xs text-slate-400 italic pt-2">Piensa tu respuesta y haz clic en la tarjeta para verificar...</p>
                `}
              </div>

              <div class="text-right font-mono-code text-[11px] text-slate-500">ID: ${card.id}</div>
            </div>

            ${this.ankiFlipped ? `
              <div class="grid grid-cols-2 gap-3">
                <button onclick="game.answerAnki(false)" class="btn-arcade py-3.5 rounded-xl bg-rose-500/20 hover:bg-rose-500/35 border border-rose-500/60 text-rose-200 font-arcade font-bold text-sm">
                  🔁 Otra vez (Repasar)
                </button>
                <button onclick="game.answerAnki(true)" class="btn-arcade py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-arcade font-bold text-sm">
                  ✅ ¡Me la sé! (+15 XP)
                </button>
              </div>
            ` : `
              <button onclick="game.flipAnki()" class="btn-arcade w-full py-3.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-arcade font-bold text-sm">
                Mostrar Respuesta
              </button>
            `}
          </div>
        `;
      },

      flipAnki() {
        sfx.click();
        this.ankiFlipped = !this.ankiFlipped;
        this.renderAnki();
      },

      answerAnki(known) {
        const card = this.ankiDeck[this.ankiIndex];
        if (known) {
          sfx.hit();
          this.markMastered(card.id, 15);
        } else {
          sfx.boom();
          this.markMistake(card.id);
          this.ankiDeck.push(card);
        }
        this.ankiIndex++;
        this.ankiFlipped = false;
        this.renderAnki();
      },

      startMatch(cat) {
        sfx.click();
        this.stopTimers();
        this.currentCat = cat;
        const pool = this.shuffle(this.getPairsByCat(cat)).slice(0, 5);
        this.matchPairs = pool;
        this.matchLeftOrder = this.shuffle(pool);
        this.matchRightOrder = this.shuffle(pool);
        this.matchSelLeft = null;
        this.matchMatchedIds = [];
        this.matchCombo = 0;
        this.renderMatch();
      },

      renderMatch() {
        const root = document.getElementById('game-root');
        const allDone = this.matchMatchedIds.length === this.matchPairs.length;

        if (allDone) {
          root.innerHTML = `
            <div class="arcade-panel rounded-2xl p-8 text-center space-y-4 max-w-lg mx-auto pop-in">
              <div class="text-5xl">⚡</div>
              <h2 class="font-arcade text-2xl font-bold text-amber-400 uppercase">¡Tablero Conectado!</h2>
              <p class="text-sm text-slate-300">Combo final: <strong>x${this.matchCombo}</strong> en <strong>${this.escapeHtml(this.currentCat)}</strong>.</p>
              <div class="flex flex-wrap justify-center gap-3 pt-2">
                <button onclick="game.startMatch('${this.currentCat.replace(/'/g, "\\'")}')" class="btn-arcade px-4 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-sm">Siguiente Tablero</button>
                <button onclick="game.showMenu()" class="btn-arcade px-4 py-2.5 rounded-xl bg-slate-800 text-slate-200 font-bold text-sm">Volver al Menú</button>
              </div>
            </div>
          `;
          return;
        }

        const leftHtml = this.matchLeftOrder.map(p => {
          const done = this.matchMatchedIds.includes(p.id);
          const sel = this.matchSelLeft === p.id;
          return `
            <button ${done ? 'disabled' : ''} onclick="game.selectMatchLeft('${p.id}')" class="w-full text-left p-3 rounded-xl border text-xs sm:text-sm leading-snug transition ${
              done
                ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-400/50 line-through opacity-50'
                : sel
                  ? 'bg-cyan-500/25 border-cyan-400 text-white shadow-lg shadow-cyan-500/20'
                  : 'bg-slate-900/90 border-slate-700 text-slate-200 hover:border-cyan-500/60'
            }">${this.escapeHtml(p.left)}</button>
          `;
        }).join('');

        const rightHtml = this.matchRightOrder.map(p => {
          const done = this.matchMatchedIds.includes(p.id);
          return `
            <button ${done ? 'disabled' : ''} onclick="game.selectMatchRight('${p.id}')" class="w-full text-left p-3 rounded-xl border text-xs sm:text-sm leading-snug transition ${
              done
                ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-400/50 line-through opacity-50'
                : 'bg-slate-900/90 border-slate-700 text-emerald-200 hover:border-amber-400/70'
            }">${this.escapeHtml(p.right)}</button>
          `;
        }).join('');

        root.innerHTML = `
          <div class="space-y-4 pop-in">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <button onclick="game.showMenu()" class="btn-arcade px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">← Menú</button>
              <span class="font-arcade text-sm text-amber-400 uppercase">⚡ Conecta-Pares • ${this.escapeHtml(this.currentCat)}</span>
              <span class="font-mono-code text-xs px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/40">Combo x${this.matchCombo}</span>
            </div>
            <p class="text-xs text-slate-400">1) Selecciona una pregunta a la izquierda. 2) Toca su respuesta correcta a la derecha.</p>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 ${this.matchErrorFlash ? 'animate-shake' : ''}">
              <div class="space-y-2.5">
                <div class="font-mono-code text-[11px] text-cyan-400 uppercase">Preguntas</div>
                ${leftHtml}
              </div>
              <div class="space-y-2.5">
                <div class="font-mono-code text-[11px] text-emerald-400 uppercase">Respuestas</div>
                ${rightHtml}
              </div>
            </div>
          </div>
        `;
        this.matchErrorFlash = false;
      },

      selectMatchLeft(id) {
        sfx.click();
        this.matchSelLeft = id;
        this.renderMatch();
      },

      selectMatchRight(id) {
        if (!this.matchSelLeft) return;
        if (this.matchSelLeft === id) {
          sfx.hit();
          this.matchMatchedIds.push(id);
          this.matchCombo++;
          this.markMastered(id, 10 + this.matchCombo * 2);
          this.matchSelLeft = null;
        } else {
          sfx.boom();
          this.matchCombo = 0;
          this.matchErrorFlash = true;
          this.markMistake(this.matchSelLeft);
          this.matchSelLeft = null;
        }
        this.renderMatch();
      },

      startMemo(cat) {
        sfx.click();
        this.stopTimers();
        this.currentCat = cat;
        const chosen = this.shuffle(this.getPairsByCat(cat)).slice(0, 6);
        const deck = [];
        chosen.forEach(p => {
          deck.push({ uid: p.id + '_L', pairId: p.id, side: 'P', text: p.left });
          deck.push({ uid: p.id + '_R', pairId: p.id, side: 'R', text: p.right });
        });
        this.memoCards = this.shuffle(deck);
        this.memoFlipped = [];
        this.memoMatched = [];
        this.memoMoves = 0;
        this.memoLocked = false;
        this.renderMemo();
      },

      renderMemo() {
        const root = document.getElementById('game-root');
        const totalPairs = this.memoCards.length / 2;
        if (this.memoMatched.length === totalPairs && totalPairs > 0) {
          root.innerHTML = `
            <div class="arcade-panel rounded-2xl p-8 text-center space-y-4 max-w-lg mx-auto pop-in">
              <div class="text-5xl">🧠</div>
              <h2 class="font-arcade text-2xl font-bold text-emerald-400 uppercase">¡Memorama Completado!</h2>
              <p class="text-sm text-slate-300">Encontraste las ${totalPairs} parejas en <strong>${this.memoMoves} intentos</strong>.</p>
              <div class="flex flex-wrap justify-center gap-3 pt-2">
                <button onclick="game.startMemo('${this.currentCat.replace(/'/g, "\\'")}')" class="btn-arcade px-4 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-bold text-sm">Jugar Otro Memorama</button>
                <button onclick="game.showMenu()" class="btn-arcade px-4 py-2.5 rounded-xl bg-slate-800 text-slate-200 font-bold text-sm">Volver al Menú</button>
              </div>
            </div>
          `;
          return;
        }

        const gridHtml = this.memoCards.map((c, idx) => {
          const isMatched = this.memoMatched.includes(c.pairId);
          const isOpen = isMatched || this.memoFlipped.includes(idx);
          return `
            <button onclick="game.flipMemo(${idx})" class="min-h-[120px] p-3 rounded-xl border text-left transition flex flex-col justify-between ${
              isMatched
                ? 'bg-emerald-950/60 border-emerald-400/60 text-emerald-200'
                : isOpen
                  ? (c.side === 'P' ? 'bg-cyan-950/80 border-cyan-400 text-white' : 'bg-amber-950/70 border-amber-400 text-amber-100')
                  : 'bg-slate-900 border-slate-700 hover:border-cyan-500/60 items-center justify-center'
            }">
              ${isOpen ? `
                <span class="font-mono-code text-[10px] uppercase ${c.side === 'P' ? 'text-cyan-300' : 'text-amber-300'}">${c.side === 'P' ? 'Pregunta' : 'Respuesta'}</span>
                <span class="text-[11px] sm:text-xs leading-snug mt-1">${this.escapeHtml(c.text)}</span>
              ` : `
                <span class="text-2xl opacity-70">🫀</span>
                <span class="font-mono-code text-[10px] text-slate-500 mt-1">Voltear</span>
              `}
            </button>
          `;
        }).join('');

        root.innerHTML = `
          <div class="space-y-4 pop-in">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <button onclick="game.showMenu()" class="btn-arcade px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">← Menú</button>
              <span class="font-arcade text-sm text-emerald-400 uppercase">🧠 Memorama • ${this.escapeHtml(this.currentCat)}</span>
              <span class="font-mono-code text-xs text-slate-300">Parejas: ${this.memoMatched.length}/${totalPairs} • Intentos: ${this.memoMoves}</span>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
              ${gridHtml}
            </div>
          </div>
        `;
      },

      flipMemo(idx) {
        if (this.memoLocked) return;
        const card = this.memoCards[idx];
        if (this.memoMatched.includes(card.pairId) || this.memoFlipped.includes(idx)) return;

        sfx.click();
        this.memoFlipped.push(idx);
        this.renderMemo();

        if (this.memoFlipped.length === 2) {
          this.memoMoves++;
          this.memoLocked = true;
          const [i1, i2] = this.memoFlipped;
          const c1 = this.memoCards[i1];
          const c2 = this.memoCards[i2];

          if (c1.pairId === c2.pairId && c1.side !== c2.side) {
            sfx.hit();
            this.memoMatched.push(c1.pairId);
            this.markMastered(c1.pairId, 20);
            this.memoFlipped = [];
            this.memoLocked = false;
            this.renderMemo();
          } else {
            setTimeout(() => {
              this.memoFlipped = [];
              this.memoLocked = false;
              this.renderMemo();
            }, 1300);
          }
        }
      },

      startShooter(cat) {
        sfx.click();
        this.stopTimers();
        this.currentCat = cat;
        this.shooterQueue = this.shuffle(this.getPairsByCat(cat));
        this.shooterIndex = 0;
        this.shield = 100;
        this.lasers = [];
        this.particles = [];
        this.feedbackMsg = '';
        this.feedbackTimer = 0;
        this.shooterActive = true;

        const root = document.getElementById('game-root');
        root.innerHTML = `
          <div class="space-y-3 pop-in">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <button onclick="game.showMenu()" class="btn-arcade px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">← Menú</button>
              <span class="font-arcade text-sm text-cyan-400 uppercase">🚀 Defensa Láser • ${this.escapeHtml(cat)}</span>
              <div class="flex items-center gap-2">
                <button onclick="game.setShooterSpeed('slow')" id="btn-spd-slow" class="px-2.5 py-1 rounded-lg text-[11px] font-bold border ${this.shooterSpeed === 'slow' ? 'bg-emerald-500 text-slate-950 border-emerald-300' : 'bg-slate-900 text-slate-300 border-slate-700'}">🐢 LENTO</button>
                <button onclick="game.setShooterSpeed('comfortable')" id="btn-spd-comf" class="px-2.5 py-1 rounded-lg text-[11px] font-bold border ${this.shooterSpeed === 'comfortable' ? 'bg-cyan-500 text-slate-950 border-cyan-300' : 'bg-slate-900 text-slate-300 border-slate-700'}">🚀 CÓMODO</button>
              </div>
            </div>

            <div class="flex items-center justify-between font-mono-code text-xs px-1">
              <span id="shooter-progress" class="text-slate-300">Nave 1 / ${this.shooterQueue.length}</span>
              <span id="shooter-shield" class="text-emerald-400 font-bold">Escudo: 100%</span>
            </div>

            <div class="arcade-panel rounded-2xl p-2">
              <canvas id="shooter-canvas"></canvas>
            </div>

            <div id="shooter-buttons" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5"></div>
          </div>
        `;

        this.canvas = document.getElementById('shooter-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.resizeCanvas();

        this.stars = Array.from({ length: 45 }, () => ({
          x: Math.random() * this.canvas.width,
          y: Math.random() * this.canvas.height,
          r: Math.random() * 1.6 + 0.5,
          vy: Math.random() * 0.4 + 0.15
        }));

        this.spawnEnemy();
        this.shooterLoop();
      },

      setShooterSpeed(spd) {
        sfx.click();
        this.shooterSpeed = spd;
        if (this.enemy) {
          this.enemy.vy = spd === 'slow' ? 0.18 : 0.34;
        }
        const bSlow = document.getElementById('btn-spd-slow');
        const bComf = document.getElementById('btn-spd-comf');
        if (bSlow && bComf) {
          bSlow.className = `px-2.5 py-1 rounded-lg text-[11px] font-bold border ${spd === 'slow' ? 'bg-emerald-500 text-slate-950 border-emerald-300' : 'bg-slate-900 text-slate-300 border-slate-700'}`;
          bComf.className = `px-2.5 py-1 rounded-lg text-[11px] font-bold border ${spd === 'comfortable' ? 'bg-cyan-500 text-slate-950 border-cyan-300' : 'bg-slate-900 text-slate-300 border-slate-700'}`;
        }
      },

      resizeCanvas() {
        if (!this.canvas || !this.canvas.parentElement) return;
        const rect = this.canvas.parentElement.getBoundingClientRect();
        this.canvas.width = Math.max(300, Math.floor(rect.width - 16));
        this.canvas.height = 360;
        if (this.enemy) {
          this.enemy.x = this.canvas.width / 2;
        }
        if (this.turrets && this.turrets.length === 4) {
          this.turrets.forEach((t, idx) => {
            t.x = (this.canvas.width / 4) * idx + (this.canvas.width / 8);
          });
        }
      },

      spawnEnemy() {
        if (this.shooterIndex >= this.shooterQueue.length || this.shield <= 0) {
          this.finishShooter();
          return;
        }
        const pair = this.shooterQueue[this.shooterIndex];
        const w = this.canvas ? this.canvas.width : 640;
        this.enemy = {
          pair,
          x: w / 2,
          y: 58,
          vy: this.shooterSpeed === 'slow' ? 0.18 : 0.34,
          pulse: 0
        };

        const distractors = this.getDistractors(pair, 3);
        const options = this.shuffle([
          { text: pair.right, correct: true },
          ...distractors.map(d => ({ text: d.right, correct: false }))
        ]);

        this.turrets = options.map((opt, idx) => ({
          idx,
          text: opt.text,
          correct: opt.correct,
          x: (w / 4) * idx + (w / 8),
          y: 318
        }));

        const progEl = document.getElementById('shooter-progress');
        const shEl = document.getElementById('shooter-shield');
        if (progEl) progEl.textContent = `Nave ${this.shooterIndex + 1} / ${this.shooterQueue.length}`;
        if (shEl) {
          shEl.textContent = `Escudo: ${this.shield}%`;
          shEl.className = `font-bold ${this.shield > 50 ? 'text-emerald-400' : this.shield > 25 ? 'text-amber-400' : 'text-rose-400'}`;
        }

        const btnBox = document.getElementById('shooter-buttons');
        if (btnBox) {
          const labels = ['A', 'B', 'C', 'D'];
          btnBox.innerHTML = this.turrets.map((t, idx) => `
            <button onclick="game.fireTurret(${idx})" class="btn-arcade text-left p-3 rounded-xl bg-slate-900/95 hover:bg-slate-800 border border-cyan-500/35 hover:border-cyan-400 text-xs sm:text-sm text-slate-100 flex items-start gap-2.5 leading-snug">
              <span class="shrink-0 w-6 h-6 rounded-lg bg-cyan-500/20 border border-cyan-400/50 text-cyan-300 font-arcade font-bold flex items-center justify-center text-xs">${labels[idx]}</span>
              <span>${this.escapeHtml(t.text)}</span>
            </button>
          `).join('');
        }
      },

      fireTurret(idx) {
        if (!this.shooterActive || !this.enemy || !this.turrets[idx]) return;
        const turret = this.turrets[idx];
        sfx.laser();
        this.lasers.push({
          x: turret.x,
          y: turret.y - 12,
          tx: this.enemy.x,
          ty: this.enemy.y,
          progress: 0,
          color: turret.correct ? '#34d399' : '#f43f5e'
        });

        if (turret.correct) {
          sfx.hit();
          this.spawnExplosion(this.enemy.x, this.enemy.y, '#34d399');
          this.markMastered(this.enemy.pair.id, 20);
          this.feedbackMsg = '¡IMPACTO DIRECTO! +20 XP';
          this.feedbackColor = '#34d399';
          this.feedbackTimer = 60;
          this.shooterIndex++;
          this.enemy = null;
          setTimeout(() => {
            if (this.shooterActive) this.spawnEnemy();
          }, 320);
        } else {
          sfx.boom();
          this.shield = Math.max(0, this.shield - 20);
          this.markMistake(this.enemy.pair.id);
          this.spawnExplosion(turret.x, turret.y - 20, '#f43f5e');
          this.feedbackMsg = '¡FALLO! -20% ESCUDO';
          this.feedbackColor = '#f43f5e';
          this.feedbackTimer = 60;
          const shEl = document.getElementById('shooter-shield');
          if (shEl) shEl.textContent = `Escudo: ${this.shield}%`;
          if (this.shield <= 0) {
            this.finishShooter();
          }
        }
      },

      spawnExplosion(x, y, color) {
        for (let i = 0; i < 18; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 3.5 + 1;
          this.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 28,
            color
          });
        }
      },

      wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        const lines = [];
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + ' ';
          if (ctx.measureText(testLine).width > maxWidth && n > 0) {
            lines.push(line.trim());
            line = words[n] + ' ';
          } else {
            line = testLine;
          }
        }
        lines.push(line.trim());
        const startY = y - ((lines.length - 1) * lineHeight) / 2;
        lines.forEach((l, i) => ctx.fillText(l, x, startY + i * lineHeight));
        return lines.length;
      },

      shooterLoop() {
        if (!this.shooterActive || !this.ctx || !this.canvas) return;
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;

        ctx.clearRect(0, 0, w, h);

        ctx.fillStyle = 'rgba(148, 163, 184, 0.55)';
        this.stars.forEach(s => {
          s.y += s.vy;
          if (s.y > h) { s.y = 0; s.x = Math.random() * w; }
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.strokeStyle = this.shield > 40 ? 'rgba(52, 211, 153, 0.5)' : 'rgba(244, 63, 94, 0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(16, h - 42);
        ctx.lineTo(w - 16, h - 42);
        ctx.stroke();

        const tLabels = ['A', 'B', 'C', 'D'];
        this.turrets.forEach((t, i) => {
          ctx.fillStyle = '#0f172a';
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(t.x, h - 22, 14, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#7dd3fc';
          ctx.font = 'bold 12px "Chakra Petch", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(tLabels[i], t.x, h - 22);
        });

        if (this.enemy) {
          this.enemy.y += this.enemy.vy;
          this.enemy.pulse += 0.08;

          const boxW = Math.min(w - 24, 560);
          ctx.font = 'bold 13px "Inter", sans-serif';
          const words = this.enemy.pair.left.split(' ');
          let tmpLine = '';
          let lineCount = 1;
          for (let n = 0; n < words.length; n++) {
            const test = tmpLine + words[n] + ' ';
            if (ctx.measureText(test).width > boxW - 28 && n > 0) {
              lineCount++;
              tmpLine = words[n] + ' ';
            } else {
              tmpLine = test;
            }
          }
          const boxH = Math.max(68, lineCount * 17 + 34);
          const bx = this.enemy.x - boxW / 2;
          const by = this.enemy.y - boxH / 2;

          ctx.fillStyle = 'rgba(15, 23, 42, 0.96)';
          ctx.strokeStyle = '#f43f5e';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(bx, by, boxW, boxH, 12);
          } else {
            ctx.rect(bx, by, boxW, boxH);
          }
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#fda4af';
          ctx.font = 'bold 10px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(this.enemy.pair.cat.toUpperCase(), this.enemy.x, by + 15);

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 13px "Inter", sans-serif';
          this.wrapCanvasText(ctx, this.enemy.pair.left, this.enemy.x, by + 24 + (boxH - 26) / 2, boxW - 28, 17);

          if (this.enemy.y + boxH / 2 >= h - 42) {
            sfx.boom();
            this.shield = Math.max(0, this.shield - 25);
            this.markMistake(this.enemy.pair.id);
            this.spawnExplosion(this.enemy.x, h - 46, '#f43f5e');
            this.feedbackMsg = '¡IMPACTO EN ESCUDO! -25%';
            this.feedbackColor = '#f43f5e';
            this.feedbackTimer = 60;
            this.shooterIndex++;
            this.enemy = null;
            if (this.shield <= 0) {
              this.finishShooter();
              return;
            }
            setTimeout(() => {
              if (this.shooterActive) this.spawnEnemy();
            }, 350);
          }
        }

        this.lasers = this.lasers.filter(l => {
          l.progress += 0.22;
          const cx = l.x + (l.tx - l.x) * l.progress;
          const cy = l.y + (l.ty - l.y) * l.progress;
          ctx.strokeStyle = l.color;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(l.x, l.y);
          ctx.lineTo(cx, cy);
          ctx.stroke();
          return l.progress < 1;
        });

        this.particles = this.particles.filter(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.life / 28);
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
          return p.life > 0;
        });

        if (this.feedbackTimer > 0) {
          this.feedbackTimer--;
          ctx.fillStyle = this.feedbackColor;
          ctx.font = 'bold 14px "Chakra Petch", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(this.feedbackMsg, w / 2, 24);
        }

        this.rafId = requestAnimationFrame(() => this.shooterLoop());
      },

      finishShooter() {
        this.stopTimers();
        const won = this.shield > 0;
        const root = document.getElementById('game-root');
        root.innerHTML = `
          <div class="arcade-panel rounded-2xl p-8 text-center space-y-4 max-w-lg mx-auto pop-in">
            <div class="text-5xl">${won ? '🚀' : '💥'}</div>
            <h2 class="font-arcade text-2xl font-bold ${won ? 'text-emerald-400' : 'text-rose-400'} uppercase">
              ${won ? '¡Sector Defendido!' : 'Escudo Caído'}
            </h2>
            <p class="text-sm text-slate-300">Escudo restante: <strong>${this.shield}%</strong> en <strong>${this.escapeHtml(this.currentCat)}</strong>.</p>
            <div class="flex flex-wrap justify-center gap-3 pt-2">
              <button onclick="game.startShooter('${this.currentCat.replace(/'/g, "\\'")}')" class="btn-arcade px-4 py-2.5 rounded-xl bg-cyan-500 text-slate-950 font-bold text-sm">Volver a Jugar</button>
              <button onclick="game.showMenu()" class="btn-arcade px-4 py-2.5 rounded-xl bg-slate-800 text-slate-200 font-bold text-sm">Volver al Menú</button>
            </div>
          </div>
        `;
      },

      startBoss(cat) {
        sfx.click();
        this.stopTimers();
        this.currentCat = cat;
        this.bossQueue = this.shuffle(this.getPairsByCat(cat));
        this.bossIdx = 0;
        this.bossMaxHp = this.bossQueue.length * 100;
        this.bossHp = this.bossMaxHp;
        this.playerHp = 100;
        this.bossLog = '¡El Jefe Cardiovascular ha aparecido! Responde en menos de 15s para golpe crítico.';
        this.bossName = cat === 'ALL_MISTAKES' ? 'Tormenta de Fallos' : `Jefe: ${cat}`;
        this.prepareBossTurn();
      },

      prepareBossTurn() {
        if (this.bossTimerId) clearInterval(this.bossTimerId);
        if (this.bossHp <= 0 || this.playerHp <= 0 || this.bossIdx >= this.bossQueue.length) {
          this.renderBossResult();
          return;
        }
        const pair = this.bossQueue[this.bossIdx];
        const distractors = this.getDistractors(pair, 3);
        this.bossOptions = this.shuffle([
          { text: pair.right, correct: true },
          ...distractors.map(d => ({ text: d.right, correct: false }))
        ]);
        this.bossAnswered = false;
        this.bossTimer = 25;
        this.renderBoss();

        this.bossTimerId = setInterval(() => {
          if (this.bossAnswered) return;
          this.bossTimer--;
          const tEl = document.getElementById('boss-timer');
          if (tEl) tEl.textContent = `${this.bossTimer}s`;
          if (this.bossTimer <= 0) {
            clearInterval(this.bossTimerId);
            this.answerBoss(-1);
          }
        }, 1000);
      },

      renderBoss() {
        const root = document.getElementById('game-root');
        const pair = this.bossQueue[this.bossIdx];
        const bossPct = Math.max(0, Math.round((this.bossHp / this.bossMaxHp) * 100));
        const labels = ['A', 'B', 'C', 'D'];

        const optsHtml = this.bossOptions.map((opt, idx) => `
          <button ${this.bossAnswered ? 'disabled' : ''} onclick="game.answerBoss(${idx})" class="btn-arcade w-full text-left p-3.5 rounded-xl border text-xs sm:text-sm leading-snug flex items-start gap-2.5 ${
            this.bossAnswered
              ? (opt.correct ? 'bg-emerald-500/25 border-emerald-400 text-emerald-100' : 'bg-slate-900/60 border-slate-800 text-slate-500')
              : 'bg-slate-900/95 hover:bg-slate-800 border-rose-500/35 hover:border-cyan-400 text-slate-100'
          }">
            <span class="shrink-0 w-6 h-6 rounded-lg bg-rose-500/20 border border-rose-400/50 text-rose-300 font-arcade font-bold flex items-center justify-center text-xs">${labels[idx]}</span>
            <span>${this.escapeHtml(opt.text)}</span>
          </button>
        `).join('');

        root.innerHTML = `
          <div class="max-w-3xl mx-auto w-full space-y-4 pop-in">
            <div class="flex items-center justify-between">
              <button onclick="game.showMenu()" class="btn-arcade px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold">← Menú</button>
              <span class="font-mono-code text-xs text-slate-400">Turno ${this.bossIdx + 1} / ${this.bossQueue.length}</span>
              <span id="boss-timer" class="font-mono-code text-sm font-bold px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/40">${this.bossTimer}s</span>
            </div>

            <div class="arcade-panel rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-2 gap-4 border-rose-500/40">
              <div>
                <div class="flex justify-between text-xs font-arcade font-bold mb-1">
                  <span class="text-rose-400 uppercase">👾 ${this.escapeHtml(this.bossName)}</span>
                  <span class="text-rose-300">${this.bossHp} / ${this.bossMaxHp} HP</span>
                </div>
                <div class="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-rose-900">
                  <div class="h-full bg-gradient-to-r from-rose-600 to-amber-500 transition-all duration-300" style="width:${bossPct}%"></div>
                </div>
              </div>
              <div>
                <div class="flex justify-between text-xs font-arcade font-bold mb-1">
                  <span class="text-emerald-400 uppercase">🛡️ Tu Escudo Cardíaco</span>
                  <span class="text-emerald-300">${this.playerHp} / 100 HP</span>
                </div>
                <div class="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-emerald-900">
                  <div class="h-full bg-gradient-to-r from-emerald-500 to-cyan-400 transition-all duration-300" style="width:${this.playerHp}%"></div>
                </div>
              </div>
            </div>

            <div class="text-center font-mono-code text-xs text-cyan-300">${this.escapeHtml(this.bossLog)}</div>

            <div class="arcade-panel rounded-2xl p-5">
              <p class="text-base sm:text-lg font-bold text-white leading-relaxed">${this.escapeHtml(pair.left)}</p>
            </div>

            <div class="space-y-2.5">
              ${optsHtml}
            </div>

            ${this.bossAnswered ? `
              <button onclick="game.nextBossTurn()" class="btn-arcade w-full py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-arcade font-bold text-sm">
                Siguiente Turno →
              </button>
            ` : ''}
          </div>
        `;
      },

      answerBoss(idx) {
        if (this.bossAnswered) return;
        this.bossAnswered = true;
        if (this.bossTimerId) clearInterval(this.bossTimerId);

        const pair = this.bossQueue[this.bossIdx];
        const isCorrect = idx >= 0 && this.bossOptions[idx] && this.bossOptions[idx].correct;

        if (isCorrect) {
          sfx.hit();
          const crit = this.bossTimer >= 10;
          const dmg = crit ? 130 : 100;
          this.bossHp = Math.max(0, this.bossHp - dmg);
          this.markMastered(pair.id, crit ? 25 : 15);
          this.bossLog = crit ? `¡ATAQUE CRÍTICO (-${dmg} HP al Jefe)! +25 XP` : `¡Golpe certero (-${dmg} HP al Jefe)! +15 XP`;
        } else {
          sfx.boom();
          this.playerHp = Math.max(0, this.playerHp - 25);
          this.markMistake(pair.id);
          this.bossLog = idx === -1
            ? '¡Se acabó el tiempo! El Jefe contraataca (-25 HP).'
            : '¡Respuesta incorrecta! El Jefe contraataca (-25 HP). Revisa la respuesta en verde.';
        }
        this.renderBoss();
      },

      nextBossTurn() {
        sfx.click();
        this.bossIdx++;
        this.prepareBossTurn();
      },

      renderBossResult() {
        this.stopTimers();
        const won = this.playerHp > 0;
        const root = document.getElementById('game-root');
        root.innerHTML = `
          <div class="arcade-panel rounded-2xl p-8 text-center space-y-4 max-w-lg mx-auto pop-in">
            <div class="text-5xl">${won ? '👑' : '💀'}</div>
            <h2 class="font-arcade text-2xl font-bold ${won ? 'text-emerald-400' : 'text-rose-400'} uppercase">
              ${won ? '¡Jefe Derrotado!' : 'Derrota Clínica'}
            </h2>
            <p class="text-sm text-slate-300">
              ${won ? 'Dominaste la batalla contra' : 'El jefe te superó en'} <strong>${this.escapeHtml(this.bossName)}</strong>.
            </p>
            <div class="flex flex-wrap justify-center gap-3 pt-2">
              <button onclick="game.startBoss('${this.currentCat.replace(/'/g, "\\'")}')" class="btn-arcade px-4 py-2.5 rounded-xl bg-rose-500 text-white font-bold text-sm">Revancha</button>
              <button onclick="game.showMenu()" class="btn-arcade px-4 py-2.5 rounded-xl bg-slate-800 text-slate-200 font-bold text-sm">Volver al Menú</button>
            </div>
          </div>
        `;
      },

      openAnkiModal() {
        sfx.click();
        const modal = document.getElementById('anki-modal');
        if (modal) modal.classList.remove('hidden');
        this.setAnkiExport(this.mistakes.length > 0 ? 'mistakes' : 'all');
      },

      closeAnkiModal() {
        sfx.click();
        const modal = document.getElementById('anki-modal');
        if (modal) modal.classList.add('hidden');
        const st = document.getElementById('anki-status');
        if (st) st.classList.add('hidden');
      },

      setAnkiExport(mode) {
        let list = HAS_PAIRS;
        if (mode === 'mistakes') {
          list = HAS_PAIRS.filter(p => this.mistakes.includes(p.id));
        } else if (mode === 'C1') {
          list = HAS_PAIRS.filter(p => (p.mission || 'C1') === 'C1');
        } else if (mode === 'C2') {
          list = HAS_PAIRS.filter(p => p.mission === 'C2');
        }
        const ta = document.getElementById('anki-textarea');
        if (!ta) return;
        if (!list.length) {
          ta.value = 'No tienes fallos registrados todavía. ¡Excelente trabajo!';
          return;
        }
        ta.value = list.map(p => `${p.left.replace(/;/g, ',')} ; ${p.right.replace(/;/g, ',')}`).join('\n');
      },

      copyAnkiText() {
        const ta = document.getElementById('anki-textarea');
        const st = document.getElementById('anki-status');
        if (!ta) return;
        ta.select();
        ta.setSelectionRange(0, 99999);
        try {
          document.execCommand('copy');
          sfx.hit();
          if (st) st.classList.remove('hidden');
        } catch (e) {}
      }
    };

    window.addEventListener('resize', () => game.resizeCanvas());
    window.addEventListener('keydown', (e) => {
      if (game.shooterActive && ['1', '2', '3', '4'].includes(e.key)) {
        game.fireTurret(parseInt(e.key, 10) - 1);
      } else if (game.bossQueue.length > 0 && !game.bossAnswered && document.getElementById('boss-timer') && ['1', '2', '3', '4'].includes(e.key)) {
        game.answerBoss(parseInt(e.key, 10) - 1);
      } else if (game.ankiDeck.length > 0 && game.ankiIndex < game.ankiDeck.length && e.code === 'Space' && !game.shooterActive && !document.getElementById('boss-timer')) {
        e.preventDefault();
        game.flipAnki();
      }
    });
    window.onload = () => game.init();
  </script>
</body>
</html>
