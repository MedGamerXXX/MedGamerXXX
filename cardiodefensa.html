        radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),

    @keyframes shake {

      height: 360px;
      border-radius: 0.75rem;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);

  <script>
    const sfx = {
      ctx: null,
      playTone(freq, type, duration, vol = 0.08) {
        try {
          if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      },
      click() { this.playTone(540, 'triangle', 0.08, 0.06); },
      laser() { this.playTone(880, 'sawtooth', 0.12, 0.07); },
      hit()   { this.playTone(620, 'sine', 0.14, 0.09); setTimeout(() => this.playTone(930, 'sine', 0.18, 0.09), 70); },
      boom()  { this.playTone(150, 'sawtooth', 0.28, 0.11); }
    };

    const HAS_PAIRS = [
      // ==================== CARDIOLOGÍA 1 (134 TARJETAS COMPLETAS) ====================
      { id: 'm0a', topic: '1. HAS', cat: 'HAS 1: Medición y Diagnóstico', left: '¿Cuáles son los valores de presión arterial óptima, normal y normal-alta?', right: 'Óptima: <120 y <80 mmHg; Normal: 120–129 y/o 80–84 mmHg; Normal-alta: 130–139 y/o 85–89 mmHg.' },
      { id: 'm0b', topic: '1. HAS', cat: 'HAS 1: Medición y Diagnóstico', left: '¿Cuáles son los valores de hipertensión arterial grado 1, grado 2, grado 3 y sistólica aislada?', right: 'Grado 1: 140–159 / 90–99 mmHg; Grado 2: 160–179 / 100–109 mmHg; Grado 3: ≥180 y/o ≥110 mmHg; Sistólica aislada: ≥140 y <90 mmHg.' },
      { id: 'm0c', topic: '1. HAS', cat: 'HAS 1: Medición y Diagnóstico', left: '¿Cuáles son los umbrales diagnósticos de hipertensión en monitoreo ambulatorio (MAPA) y domiciliario (MDPA)?', right: 'MAPA de 24 horas: ≥130/80 mmHg; MAPA diurno o monitoreo en casa (MDPA): ≥135/85 mmHg; MAPA nocturno: ≥120/70 mmHg.' },
      { id: 'm1', topic: '1. HAS', cat: 'HAS 1: Medición y Diagnóstico', left: '¿Qué tiempo de reposo y abstinencia se requiere antes de medir la presión arterial?', right: 'Reposo sentado de 5 minutos y evitar café, tabaco y ejercicio durante los 30 minutos previos.' },
      { id: 'm2', topic: '1. HAS', cat: 'HAS 1: Medición y Diagnóstico', left: '¿Cuál es la postura correcta del paciente al tomar la presión arterial?', right: 'Espalda y pies apoyados sin cruzar las piernas, vejiga vacía y brazo apoyado a la altura del corazón.' },
      { id: 'm3', topic: '1. HAS', cat: 'HAS 1: Medición y Diagnóstico', left: '¿Con qué cifras se diagnostica hipertensión arterial en la población general?', right: 'Presión sistólica ≥140 mmHg y/o diastólica ≥90 mmHg (corroborar con monitoreo domiciliario o ambulatorio).' },
      { id: 'm4', topic: '1. HAS', cat: 'HAS 1: Medición y Diagnóstico', left: '¿Con qué cifras se diagnostica hipertensión en pacientes de alto riesgo (diabetes, enfermedad renal o dislipidemia)?', right: 'Presión sistólica ≥130 mmHg y/o diastólica ≥80 mmHg.' },
      { id: 'm5', topic: '1. HAS', cat: 'HAS 1: Medición y Diagnóstico', left: '¿Cómo se realizan las mediciones en consultorio durante la primera visita?', right: 'Realizar 3 tomas separadas por 1 a 2 minutos, promediar las últimas 2 (toma extra si difieren >10 mmHg) y medir en ambos brazos.' },
      { id: 'm6', topic: '1. HAS', cat: 'HAS 1: Medición y Diagnóstico', left: '¿Cómo se define la hipotensión ortostática?', right: 'Caída de la presión sistólica ≥20 mmHg o diastólica ≥10 mmHg entre 1 y 3 minutos después de ponerse de pie.' },
      { id: 'm7', topic: '1. HAS', cat: 'HAS 1: Medición y Diagnóstico', left: '¿Cómo se realiza el protocolo de monitoreo domiciliario de la presión arterial (MDPA)?', right: 'Dos tomas por la mañana y dos por la noche (intervalo de 1 a 2 minutos) durante al menos 3 de 7 días con bitácora.' },
      { id: 'm8', topic: '1. HAS', cat: 'HAS 1: Medición y Diagnóstico', left: '¿Cómo se realiza el monitoreo ambulatorio de 24 horas (MAPA), estándar de oro diagnóstico?', right: 'Tomas automáticas cada 15–30 minutos durante el día y cada 30–60 minutos por la noche, con al menos 70% de registros válidos.' },
      { id: 'm9', topic: '1. HAS', cat: 'HAS 1: Medición y Diagnóstico', left: '¿En cuántas visitas se confirma la hipertensión en consultorio y cuándo se diagnostica en una sola visita?', right: 'Confirmar en 2 a 3 visitas separadas por 1 a 4 semanas; se diagnostica en 1 visita si la presión es ≥180/110 mmHg con daño cardiovascular.' },
      { id: 'm10', topic: '1. HAS', cat: 'HAS 1: Medición y Diagnóstico', left: '¿Cuáles son los dos criterios hemodinámicos de rigidez arterial?', right: 'Presión de pulso >60 mmHg y velocidad de onda de pulso carotídeo-femoral >10 metros por segundo.' },
      { id: 'm11', topic: '1. HAS', cat: 'HAS 1: Medición y Diagnóstico', left: '¿Qué conducta se sigue ante una presión arterial casual de 135–149 / 85–109 mmHg sin alto riesgo?', right: 'Iniciar tratamiento no farmacológico y revalorar en 6 meses.' },

      { id: 'r1', topic: '1. HAS', cat: 'HAS 2: Riesgo CV (HEARTS y SCORE)', left: '¿Qué estima la calculadora HEARTS en las Américas y desde qué edad se aplica?', right: 'Estima el riesgo a 10 años de infarto de miocardio, evento vascular cerebral o muerte cardiovascular desde los 18 años.' },
      { id: 'r2', topic: '1. HAS', cat: 'HAS 2: Riesgo CV (HEARTS y SCORE)', left: '¿Qué criterios clínicos definen al paciente con riesgo cardiovascular alto?', right: 'Más de 2 factores de riesgo (obesidad, diabetes, tabaquismo, dislipidemia), daño a órgano blanco o cálculo de riesgo >10%.' },
      { id: 'r3', topic: '1. HAS', cat: 'HAS 2: Riesgo CV (HEARTS y SCORE)', left: '¿Qué criterios clínicos definen al paciente con riesgo cardiovascular muy alto?', right: 'Enfermedad cardiovascular establecida, enfermedad renal crónica o antecedente de enfermedad cerebrovascular.' },
      { id: 'r4', topic: '1. HAS', cat: 'HAS 2: Riesgo CV (HEARTS y SCORE)', left: '¿Cuáles son las 5 categorías porcentuales de riesgo en la escala HEARTS?', right: 'Bajo: <5%; Moderado: 5–10%; Alto: 10–20%; Muy alto: 20–30%; Crítico: >30%.' },
      { id: 'r5', topic: '1. HAS', cat: 'HAS 2: Riesgo CV (HEARTS y SCORE)', left: '¿Para qué grupos de edad se utilizan las variantes de la escala SCORE2?', right: 'SCORE2 de 40 a 69 años; SCORE2-OP en mayores o iguales de 70 años; SCORE2-Diabetes en mayores de 70 años con diabetes.' },
      { id: 'r6', topic: '1. HAS', cat: 'HAS 2: Riesgo CV (HEARTS y SCORE)', left: '¿Cuáles son las 3 categorías de riesgo en la escala SCORE?', right: 'Bajo: <5%; Limítrofe: 5–10%; Aumentado: >10%.' },

      { id: 's1', topic: '1. HAS', cat: 'HAS 3: Causas Secundarias', left: '¿Cuáles son las principales causas de hipertensión secundaria en menores de 18 años?', right: 'Enfermedad renal y coartación de la aorta (en menores de 11 años representan el 70 a 85% de los casos).' },
      { id: 's2', topic: '1. HAS', cat: 'HAS 3: Causas Secundarias', left: '¿Cuáles son las principales causas de hipertensión secundaria en adultos de 19 a 39 años?', right: 'Disfunción tiroidea y estenosis de la arteria renal por displasia fibromuscular.' },
      { id: 's3', topic: '1. HAS', cat: 'HAS 3: Causas Secundarias', left: '¿Cuáles son las principales causas de hipertensión secundaria en adultos de 40 a 64 años?', right: 'Hiperaldosteronismo primario, apnea obstructiva del sueño, síndrome de Cushing, disfunción tiroidea y feocromocitoma.' },
      { id: 's4', topic: '1. HAS', cat: 'HAS 3: Causas Secundarias', left: '¿Cuáles son las principales causas de hipertensión secundaria en adultos mayores de 65 años?', right: 'Estenosis de la arteria renal por aterosclerosis, enfermedad renal crónica e hipotiroidismo.' },

      { id: 'n1', topic: '1. HAS', cat: 'HAS 4: Medidas No Farmacológicas', left: '¿Cuánto reduce la presión arterial la pérdida de peso (IMC 18.5–24.9 o bajar ≥5 kg)?', right: 'Reduce entre 5 y 20 mmHg, siendo la medida no farmacológica más efectiva.' },
      { id: 'n2', topic: '1. HAS', cat: 'HAS 4: Medidas No Farmacológicas', left: '¿Cuánto reduce la presión arterial llevar una dieta tipo DASH?', right: 'Reduce entre 8 y 14 mmHg (rica en frutas, verduras y lácteos descremados).' },
      { id: 'n3', topic: '1. HAS', cat: 'HAS 4: Medidas No Farmacológicas', left: '¿Qué impacto tiene dejar de fumar sobre la presión arterial y el riesgo cardiovascular?', right: 'Reduce la presión arterial entre 5 y 10 mmHg y disminuye de forma marcada el riesgo cardiovascular.' },
      { id: 'n4', topic: '1. HAS', cat: 'HAS 4: Medidas No Farmacológicas', left: '¿Cuánto reduce la presión arterial el ejercicio aeróbico regular (≥150 minutos/semana)?', right: 'Reduce entre 4 y 9 mmHg (30–45 minutos, 5–7 días por semana, o caminar 8,000 a 12,000 pasos diarios).' },
      { id: 'n5', topic: '1. HAS', cat: 'HAS 4: Medidas No Farmacológicas', left: '¿Cuánto reduce la presión arterial restringir la ingesta de sal a menos de 5 gramos al día?', right: 'Reduce entre 2 y 8 mmHg (equivale aproximadamente a 2 gramos de sodio o 1 cucharadita al día).' },
      { id: 'n6', topic: '1. HAS', cat: 'HAS 4: Medidas No Farmacológicas', left: '¿Cuánto reduce la presión arterial moderar el consumo de alcohol (<10 g/día)?', right: 'Reduce entre 2 y 4 mmHg (límite máximo de 30 mL de etanol al día).' },
      { id: 'n7', topic: '1. HAS', cat: 'HAS 4: Medidas No Farmacológicas', left: '¿Cuáles son las metas adicionales de potasio, agua, bebidas azucaradas y ejercicio de resistencia?', right: 'Potasio 3.5 gramos al día, agua 1.5 a 2 litros al día, cero bebidas azucaradas y ejercicio de resistencia 2 a 3 días por semana (30 minutos).' },

      { id: 't1', topic: '1. HAS', cat: 'HAS 5: Escalada Terapéutica', left: '¿A partir de qué cifra se inicia tratamiento farmacológico en hipertensión arterial?', right: 'Desde ≥140/90 mmHg en población general, o desde ≥130/80 mmHg en pacientes con alto riesgo cardiovascular.' },
      { id: 't2', topic: '1. HAS', cat: 'HAS 5: Escalada Terapéutica', left: '¿En qué pacientes está indicada la monoterapia inicial en lugar de terapia dual?', right: 'Pacientes con fragilidad (escala de Rockwood 5 a 6), edad ≥85 años o hipotensión ortostática.' },
      { id: 't3', topic: '1. HAS', cat: 'HAS 5: Escalada Terapéutica', left: '¿Cuál es el esquema farmacológico inicial estándar en pacientes sin fragilidad ni mayores de 85 años?', right: 'Terapia dual a dosis media en un solo comprimido: IECA o ARA-II combinado con antagonista de canales de calcio o tiazida.' },
      { id: 't4', topic: '1. HAS', cat: 'HAS 5: Escalada Terapéutica', left: '¿Cómo se realiza la escalada mensual si el paciente no alcanza la meta (<130/80 mmHg)?', right: 'Mes 1: subir terapia dual a dosis máxima; Mes 2: terapia triple (IECA/ARA-II + antagonista de calcio + diurético); Mes 3: referir a segundo nivel.' },
      { id: 't5', topic: '1. HAS', cat: 'HAS 5: Escalada Terapéutica', left: '¿Cuándo se agrega un betabloqueador o ácido acetilsalicílico en el paciente hipertenso?', right: 'Betabloqueador si hay cardiopatía isquémica, insuficiencia cardíaca o fibrilación auricular; ácido acetilsalicílico más estatina si hay enfermedad aterosclerosa.' },
      { id: 't6', topic: '1. HAS', cat: 'HAS 5: Escalada Terapéutica', left: '¿Con qué frecuencia se cita al paciente hipertenso y qué vacunas recomienda el PRONAM?', right: 'Cita cada mes al inicio o si está descontrolado y cada 3 meses cuando está en meta; vacunar contra influenza, COVID-19 y neumococo.' },

      { id: 'g1', topic: '1. HAS', cat: 'HAS 6: Grupos Especiales', left: '¿Cuál es el abordaje y la meta de presión arterial en el adulto joven (18 a 40 años) con hipertensión?', right: 'Descartar siempre causas secundarias y mantener una meta de presión arterial <130/80 mmHg.' },
      { id: 'g2', topic: '1. HAS', cat: 'HAS 6: Grupos Especiales', left: '¿Cómo se trata al adulto mayor frágil (Rockwood 5–6) o mayor de 85 años?', right: 'Iniciar si presión ≥140/90 mmHg con antagonista de calcio dihidropiridínico, IECA o ARA-II; segunda línea diurético a dosis baja; evitar betabloqueadores y bloqueadores alfa-1.' },
      { id: 'g3', topic: '1. HAS', cat: 'HAS 6: Grupos Especiales', left: '¿Cuál es la meta de presión arterial en el adulto mayor general frente a aquel con demencia severa?', right: 'Adulto mayor general: sistólica de 130 a 139 mmHg (diastólica ≥80); Demencia severa o fragilidad avanzada: se permite hasta 140/80 mmHg.' },
      { id: 'g4', topic: '1. HAS', cat: 'HAS 6: Grupos Especiales', left: '¿Cuál es el esquema y metas en hipertensos con obesidad, diabetes tipo 2 o síndrome metabólico?', right: 'IECA o ARA-II más antagonista de canales de calcio (evitar tiazidas); bajar 5–10% del peso, HbA1c <7%, colesterol LDL <70 mg/dL y presión <130/80 mmHg.' },
      { id: 'g5', topic: '1. HAS', cat: 'HAS 6: Grupos Especiales', left: '¿Cuál es el tratamiento antihipertensivo y meta lipídica en pacientes con cardiopatía isquémica crónica?', right: 'IECA o ARA-II más betabloqueador (o antagonista de calcio no dihidropiridínico en segunda línea) y meta de colesterol LDL <55 mg/dL.' },
      { id: 'g6', topic: '1. HAS', cat: 'HAS 6: Grupos Especiales', left: '¿Qué fármacos antihipertensivos se prefieren en insuficiencia cardíaca crónica frente a fibrilación auricular?', right: 'Insuficiencia cardíaca: IECA, ARNI o antagonista de calcio (meta <130/80); Fibrilación auricular: IECA o ARA-II más betabloqueador o antagonista de calcio no dihidropiridínico y anticoagulación.' },
      { id: 'g7', topic: '1. HAS', cat: 'HAS 6: Grupos Especiales', left: '¿Cuál es la combinación preferida en pacientes con evento vascular cerebral previo o enfermedad renal crónica?', right: 'En ambos casos: IECA o ARA-II más antagonista de canales de calcio (segunda línea diurético); meta de LDL <55 mg/dL en evento cerebral y presión <130/80 mmHg en enfermedad renal.' },

      { id: 'c1', topic: '1. HAS', cat: 'HAS 7: Resistente y Crisis', left: '¿Cómo se define la hipertensión arterial resistente y qué fármaco se añade de cuarta línea?', right: 'Falta de control con 3 o más fármacos (incluyendo un diurético) a dosis máximas o necesidad de 4 o más fármacos; se añade espironolactona.' },
      { id: 'c2', topic: '1. HAS', cat: 'HAS 7: Resistente y Crisis', left: '¿Cuál es la diferencia entre urgencia hipertensiva (76%) y emergencia hipertensiva (24%)?', right: 'Ambas cursan con presión ≥180/110–120 mmHg; la urgencia NO presenta daño agudo a órgano blanco, mientras que la emergencia SÍ presenta daño agudo.' },
      { id: 'c3', topic: '1. HAS', cat: 'HAS 7: Resistente y Crisis', left: '¿Cuál es el manejo correcto de la urgencia hipertensiva según el PRONAM?', right: 'Manejo ambulatorio por vía oral (NUNCA sublingual ni nifedipino de acción corta), por ejemplo amlodipino 5–10 mg, descendiendo la presión en 24 a 48 horas.' },
      { id: 'c4', topic: '1. HAS', cat: 'HAS 7: Resistente y Crisis', left: '¿Cuál es la meta general de descenso de presión en una emergencia hipertensiva?', right: 'Referencia a segundo o tercer nivel, bajar la presión arterial 20 a 25% en 1 a 2 horas por vía intravenosa, pasar a vía oral en 6 a 12 horas y normalizar en 48 a 72 horas.' },
      { id: 'c5', topic: '1. HAS', cat: 'HAS 7: Resistente y Crisis', left: '¿Qué alteraciones metabólicas contraindican o limitan el uso de diuréticos tiazídicos (clortalidona, hidroclorotiazida)?', right: 'Evitar en pacientes con gota (hiperuricemia), hiponatremia, hipokalemia e hipercalcemia.' },
      { id: 'c6', topic: '1. HAS', cat: 'HAS 7: Resistente y Crisis', left: '¿Qué efectos adversos vigilar con diuréticos de asa frente a espironolactona?', right: 'Diuréticos de asa (furosemida): depleción de volumen, hiponatremia e hipokalemia; Espironolactona: evitar en hiperkalemia y tasa de filtración glomerular muy baja.' },
      { id: 'c7', topic: '1. HAS', cat: 'HAS 7: Resistente y Crisis', left: '¿Qué contraindicaciones diferencian a los betabloqueadores cardioselectivos de los no selectivos?', right: 'Cardioselectivos (metoprolol): evitar en bloqueo auriculoventricular de segundo o tercer grado; No selectivos (propranolol, labetalol): evitar además en asma.' },
      { id: 'c8', topic: '1. HAS', cat: 'HAS 7: Resistente y Crisis', left: '¿Cuáles son las contraindicaciones de IECA y ARA-II y qué efecto distingue al IECA?', right: 'Ambos contraindicados en embarazo, estenosis bilateral de arteria renal e hiperkalemia; los IECA producen tos y angioedema; nunca combinar IECA con ARA-II.' },
      { id: 'c9', topic: '1. HAS', cat: 'HAS 7: Resistente y Crisis', left: '¿Cuál es el efecto adverso característico de amlodipino, prazosina, clonidina e hidralazina?', right: 'Amlodipino: edema de miembros inferiores; Prazosina: hipotensión ortostática; Clonidina: sedación; Hidralazina: taquicardia refleja.' },
      { id: 'c10', topic: '1. HAS', cat: 'HAS 7: Resistente y Crisis', left: '¿Cuál es la meta, el tiempo y el fármaco de elección en la disección aórtica aguda?', right: 'Presión sistólica <120 mmHg y frecuencia cardíaca <60 latidos por minuto en 20 minutos, utilizando esmolol o labetalol más nitroprusiato.' },
      { id: 'c11', topic: '1. HAS', cat: 'HAS 7: Resistente y Crisis', left: '¿Cuál es la meta y el tratamiento del edema agudo de pulmón cardiogénico hipertensivo?', right: 'Reducir la presión sistólica a <140 mmHg de inmediato con furosemida más nitroprusiato o nitroglicerina intravenosa.' },
      { id: 'c12', topic: '1. HAS', cat: 'HAS 7: Resistente y Crisis', left: '¿Cómo se manejan la encefalopatía hipertensiva y la hipertensión maligna?', right: 'Disminuir la presión arterial media 20 a 25% (de forma inmediata en encefalopatía o en varias horas en hipertensión maligna) con labetalol intravenoso.' },
      { id: 'c13', topic: '1. HAS', cat: 'HAS 7: Resistente y Crisis', left: '¿Cuál es el manejo de la presión arterial en el evento vascular cerebral isquémico según sea candidato o no a trombólisis?', right: 'Candidato a trombólisis: bajar de inmediato a <185/110 mmHg con labetalol; No candidato: tratar solo si supera 220/120 mmHg, bajando la presión media 15% en 24 horas.' },
      { id: 'c14', topic: '1. HAS', cat: 'HAS 7: Resistente y Crisis', left: '¿Cuál es la meta y fármaco en el evento vascular cerebral hemorrágico frente al evento coronario agudo?', right: 'Evento hemorrágico: presión sistólica <180 mmHg con labetalol; Evento coronario agudo: sistólica <140 mmHg de inmediato con nitroglicerina, labetalol o esmolol.' },
      { id: 'c15', topic: '1. HAS', cat: 'HAS 7: Resistente y Crisis', left: '¿Cuándo se trata la hipertensión perioperatoria y cuándo se difiere una cirugía electiva?', right: 'Tratar si supera 160/90 mmHg por 15 minutos con esmolol; diferir cirugía electiva si la presión sistólica es >180 mmHg o la diastólica >110 mmHg.' },

      // ==================== TEMA 2: ANGINA DE PECHO ====================
      { id: 'ang1', topic: '2. Angina', cat: 'Angina: Clínica, CCS y Tratamiento', left: '¿Cuál es la etiología más común y el mecanismo fisiopatológico de la angina de pecho?', right: 'La aterosclerosis coronaria, que produce desequilibrio entre el aporte y la demanda de oxígeno miocárdico al aumentar el trabajo cardíaco sin aumentar el flujo.' },
      { id: 'ang2', topic: '2. Angina', cat: 'Angina: Clínica, CCS y Tratamiento', left: '¿Qué fármacos antiisquémicos se eligen si predomina el aumento de demanda frente al vasoespasmo coronario?', right: 'Si aumenta la demanda de oxígeno: betabloqueadores y antagonistas de calcio no dihidropiridínicos; Si hay vasoespasmo: nitratos y antagonistas de calcio dihidropiridínicos.' },
      { id: 'ang3', topic: '2. Angina', cat: 'Angina: Clínica, CCS y Tratamiento', left: '¿Cuánto dura un episodio de angina estable y qué sugiere su aparición en reposo o nocturna?', right: 'Dura de 15 segundos a 15 minutos sin necrosis; si aparece en reposo o por la noche sugiere angina inestable o angina vasoespástica de Prinzmetal.' },
      { id: 'ang4', topic: '2. Angina', cat: 'Angina: Clínica, CCS y Tratamiento', left: '¿Cuáles son los equivalentes anginosos y qué hallazgos pueden auscultarse en un episodio agudo?', right: 'Equivalentes: disnea y dolor epigástrico, mandibular o interescapular; en la auscultación aguda pueden escucharse ruidos S3, S4 y soplo de regurgitación mitral.' },
      { id: 'ang5', topic: '2. Angina', cat: 'Angina: Clínica, CCS y Tratamiento', left: '¿Qué muestra el electrocardiograma en reposo frente a una crisis de angina y cuál es el estándar de oro diagnóstico?', right: 'En reposo puede ser normal, pero durante el dolor es anormal en ≥50% (onda T picuda por isquemia subendocárdica); el estándar de oro es la angiografía coronaria.' },
      { id: 'ang6', topic: '2. Angina', cat: 'Angina: Clínica, CCS y Tratamiento', left: '¿Cómo define la Clasificación Canadiense (CCS) las Clases I y II de angina de pecho?', right: 'Clase I: solo con ejercicio intenso o prolongado; Clase II: limitación ligera (caminar >2 cuadras en plano, subir >1 piso, frío o después de comer).' },
      { id: 'ang7', topic: '2. Angina', cat: 'Angina: Clínica, CCS y Tratamiento', left: '¿Cómo define la Clasificación Canadiense (CCS) las Clases III y IV de angina de pecho?', right: 'Clase III: limitación marcada (caminar 1 a 2 cuadras en plano o subir 1 piso); Clase IV: incapacidad para cualquier actividad física o angina en reposo.' },
      { id: 'ang8', topic: '2. Angina', cat: 'Angina: Clínica, CCS y Tratamiento', left: '¿Cuáles son los antianginosos de primera línea, segunda línea y de alivio agudo?', right: 'Primera línea: betabloqueadores; Segunda línea: antagonistas de canales de calcio o nitratos de acción prolongada; Alivio agudo: nitroglicerina sublingual.' },
      { id: 'ang9', topic: '2. Angina', cat: 'Angina: Clínica, CCS y Tratamiento', left: '¿Qué fármacos se indican para prevención secundaria en enfermedad arterial coronaria estable?', right: 'En todos: ácido acetilsalicílico y estatina de alta intensidad; en diabetes, disfunción sistólica o enfermedad renal: IECA o ARA-II; en insuficiencia cardíaca: añadir inhibidor SGLT2.' },

      // ==================== TEMA 3: SCASEST ====================
      { id: 'sca1', topic: '3. SCASEST', cat: 'SCASEST 1: Fisiopatología y Clínica', left: '¿Qué entidades conforman el SCASEST y cuál es la diferencia clave entre ambas?', right: 'Angina inestable e infarto agudo de miocardio sin elevación del segmento ST (IAMSEST); ambos cursan sin elevación del ST, pero la angina inestable no tiene necrosis (troponina y CK-MB normales), mientras que el IAMSEST sí eleva biomarcadores.' },
      { id: 'sca2', topic: '3. SCASEST', cat: 'SCASEST 1: Fisiopatología y Clínica', left: '¿Cada cuánto debe evaluarse el riesgo cardiovascular en prevención primaria según la GPC y qué personas tienen mayor riesgo de SCASEST?', right: 'Al menos cada 3 años en primer nivel de atención; es más común en personas con ≥1 factor de riesgo de aterosclerosis, enfermedad vascular periférica o trastornos inflamatorios crónicos (artritis reumatoide, psoriasis o infección).' },
      { id: 'sca3', topic: '3. SCASEST', cat: 'SCASEST 1: Fisiopatología y Clínica', left: '¿Cuál es la diferencia fisiopatológica entre un SCASEST primario y un SCASEST secundario?', right: 'El primario (más común) ocurre por ruptura de una placa aterosclerótica con agregación plaquetaria y trombo; el secundario se debe a un desequilibrio transitorio o sostenido entre el aporte y la demanda de oxígeno miocárdico.' },
      { id: 'sca4', topic: '3. SCASEST', cat: 'SCASEST 1: Fisiopatología y Clínica', left: '¿Qué causas desencadenan un SCASEST secundario por reducción del aporte o aumento de la demanda de oxígeno?', right: 'Reducción del aporte: hipertensión o hipotensión arterial grave, anemia o hipoxemia graves; Aumento de demanda: fiebre, taquicardia, hipertensión arterial grave o tirotoxicosis (se tratan dirigidamente a la causa).' },
      { id: 'sca5', topic: '3. SCASEST', cat: 'SCASEST 1: Fisiopatología y Clínica', left: '¿Qué mecanismos no ateroscleróticos pueden causar un SCASEST y qué tóxico debe interrogarse en menores de 40 años?', right: 'Vasoespasmo coronario intenso (angina de Prinzmetal, cocaína, quimioterapéuticos, triptanos) o disección arterial coronaria espontánea (frecuente en vasculitis); interrogar siempre consumo de cocaína o metanfetaminas.' },
      { id: 'sca6', topic: '3. SCASEST', cat: 'SCASEST 1: Fisiopatología y Clínica', left: '¿Cómo es la presentación clínica clásica del SCASEST?', right: 'Sensación de presión, estrujamiento o pesadez retroesternal recurrente o persistente (de minutos a horas), irradiada a brazo izquierdo, cuello o mandíbula, con diaforesis, náusea, dolor abdominal, disnea o síncope.' },
      { id: 'sca7', topic: '3. SCASEST', cat: 'SCASEST 1: Fisiopatología y Clínica', left: '¿Cuáles son las presentaciones atípicas del SCASEST y en qué grupos de pacientes son más frecuentes?', right: 'Dolor torácico vago, dolor epigástrico, indigestión aguda, fatiga inexplicable o disnea; frecuentes en jóvenes de 25 a 40 años, mayores de 75 años, mujeres y pacientes con diabetes, insuficiencia renal crónica o demencia.' },
      { id: 'sca8', topic: '3. SCASEST', cat: 'SCASEST 1: Fisiopatología y Clínica', left: '¿Qué causas no cardíacas y cardíacas no isquémicas busca descartar la exploración física en el SCASEST?', right: 'No cardíacas: costocondritis, neumotórax, embolismo pulmonar y neumonía; No isquémicas: disección aórtica, pericarditis e hipertensión arterial grave (además de anemia o tirotoxicosis).' },

      { id: 'sca9', topic: '3. SCASEST', cat: 'SCASEST 2: Escalas (Braunwald, TIMI, GRACE)', left: '¿Cómo clasifica Braunwald la angina inestable según su gravedad (Clases I, II y III)?', right: 'Clase I: inicio reciente, grave o acelerada (<2 meses, >3 veces/día, sin reposo); Clase II: angina en reposo subaguda (en el mes previo, pero no en últimas 48 horas); Clase III: angina en reposo aguda (en las últimas 48 horas).' },
      { id: 'sca10', topic: '3. SCASEST', cat: 'SCASEST 2: Escalas (Braunwald, TIMI, GRACE)', left: '¿Cómo clasifica Braunwald la angina inestable según las circunstancias clínicas (Clases A, B y C)?', right: 'Clase A: angina inestable secundaria (anemia, hipotensión o taquiarritmia); Clase B: angina inestable primaria; Clase C: angina inestable postinfarto (dentro de las 2 semanas posteriores a un infarto).' },
      { id: 'sca11', topic: '3. SCASEST', cat: 'SCASEST 2: Escalas (Braunwald, TIMI, GRACE)', left: '¿Cómo clasifica Braunwald la angina inestable según la intensidad del tratamiento (Niveles 1, 2 y 3)?', right: '1: ausencia de tratamiento o tratamiento mínimo; 2: terapia oral estándar de angina estable (betabloqueadores, nitratos, antagonistas de calcio); 3: terapia oral máxima tolerada más nitroglicerina intravenosa.' },
      { id: 'sca12', topic: '3. SCASEST', cat: 'SCASEST 2: Escalas (Braunwald, TIMI, GRACE)', left: '¿Cuáles son los 7 criterios de la escala TIMI para riesgo en SCASEST?', right: '1) Edad >65 años, 2) ≥3 factores de riesgo de aterosclerosis, 3) Arteriopatía coronaria conocida, 4) ≥2 episodios de angina en 24 horas, 5) Uso de aspirina en los 7 días previos, 6) Desviación ≥0.5 mV del segmento ST, 7) Troponina o CK-MB elevadas.' },
      { id: 'sca13', topic: '3. SCASEST', cat: 'SCASEST 2: Escalas (Braunwald, TIMI, GRACE)', left: '¿Cómo se interpreta el puntaje TIMI y cuál es la mortalidad a un año en cada nivel?', right: '0 a 2 factores: riesgo bajo (mortalidad a 1 año de 3.9%); 3 a 4 factores: riesgo intermedio (mortalidad de 6.5%); 5 a 7 factores: riesgo alto (mortalidad de 21%).' },
      { id: 'sca14', topic: '3. SCASEST', cat: 'SCASEST 2: Escalas (Braunwald, TIMI, GRACE)', left: '¿Cuáles son las 8 variables que evalúa la escala GRACE en el SCASEST?', right: 'Edad, frecuencia cardíaca, presión arterial sistólica, clase de insuficiencia cardíaca, desviación del segmento ST, paro cardíaco al ingreso, concentración de creatinina y elevación de biomarcadores.' },
      { id: 'sca15', topic: '3. SCASEST', cat: 'SCASEST 2: Escalas (Braunwald, TIMI, GRACE)', left: '¿Cuáles son los puntos de corte de la escala GRACE para mortalidad hospitalaria y mortalidad a 6 meses?', right: 'Hospitalaria: bajo ≤108 (<1%), intermedio 109–140 (1–3%), alto >140 (>3%); A 6 meses: bajo ≤88 (<3%), intermedio 89–118 (3–8%), alto >118 (>8%).' },

      { id: 'sca16', topic: '3. SCASEST', cat: 'SCASEST 3: Diagnóstico y Pruebas', left: '¿Qué signos de insuficiencia cardíaca o inestabilidad hemodinámica debe detectar el médico en el SCASEST?', right: 'Hipotensión, diaforesis/palidez o retardo en el llenado capilar, estertores crepitantes, taquicardia o bradicardia, auscultación de sonidos S3 o S4 e ingurgitación yugular.' },
      { id: 'sca17', topic: '3. SCASEST', cat: 'SCASEST 3: Diagnóstico y Pruebas', left: '¿Qué incluye el manejo prehospitalario del SCASEST según la GPC?', right: 'Reconocimiento y tratamiento de arritmias letales, además de administrar oxígeno suplementario, ácido acetilsalicílico y nitroglicerina.' },
      { id: 'sca18', topic: '3. SCASEST', cat: 'SCASEST 3: Diagnóstico y Pruebas', left: '¿En cuánto tiempo debe interpretarse el electrocardiograma en el SCASEST y qué derivaciones extra se colocan?', right: 'Interpretar en ≤10 minutos (si es normal, repetir 3 a 6 horas después o antes del egreso); usar derivaciones derechas V3R y V4R para infarto derecho y posteriores V7 a V9 para la arteria circunfleja.' },
      { id: 'sca19', topic: '3. SCASEST', cat: 'SCASEST 3: Diagnóstico y Pruebas', left: '¿En qué tiempos se solicitan y repiten las troponinas y la CK-MB en el SCASEST?', right: 'Obtener antes de los 60 minutos desde el ingreso, repetir 6 a 12 horas después si son negativas, y medir cada 6 a 8 horas hasta alcanzar su valor máximo.' },
      { id: 'sca20', topic: '3. SCASEST', cat: 'SCASEST 3: Diagnóstico y Pruebas', left: '¿Qué ventaja pronóstica y qué limitación tienen las troponinas frente a la CK-MB en el SCASEST?', right: 'Las troponinas son el mejor predictor pronóstico a 30 días de infarto o muerte súbita, pero dan falsos positivos en insuficiencia renal crónica; la CK-MB es más barata y mejor para detectar reinfarto.' },
      { id: 'sca21', topic: '3. SCASEST', cat: 'SCASEST 3: Diagnóstico y Pruebas', left: '¿Cómo se seleccionan las pruebas no invasivas según la probabilidad de isquemia en el SCASEST?', right: 'Probabilidad baja: prueba de estrés posterior; Probabilidad intermedia o alta: NO realizar angiografía por tomografía urgente, sino prueba de estrés (con perfusión) antes del alta si ceden los síntomas y no requiere angiografía invasiva.' },
      { id: 'sca22', topic: '3. SCASEST', cat: 'SCASEST 3: Diagnóstico y Pruebas', left: '¿Cuál es la utilidad del ecocardiograma en la evaluación del SCASEST?', right: 'Es útil cuando el electrocardiograma no es diagnóstico o el cuadro es incierto, pues permite identificar causas alternativas de dolor torácico como miocarditis, disección aórtica o embolismo pulmonar.' },
      { id: 'sca23', topic: '3. SCASEST', cat: 'SCASEST 3: Diagnóstico y Pruebas', left: '¿Cuáles son las 3 indicaciones para realizar una angiografía coronaria invasiva en el SCASEST?', right: '1) Riesgo alto de eventos isquémicos cardíacos; 2) Angina espontánea o inducible a pesar de tratamiento médico adecuado; 3) Presentación clínica confusa con evaluación no invasiva no concluyente.' },

      { id: 'sca24', topic: '3. SCASEST', cat: 'SCASEST 4: Tratamiento y Tiempos', left: '¿Cuáles son las 3 metas fundamentales del tratamiento en el SCASEST?', right: '1) Prevenir la isquemia recurrente (corrigiendo aporte y demanda de oxígeno); 2) Prevenir la propagación del trombo; 3) Estabilizar la placa vulnerable.' },
      { id: 'sca25', topic: '3. SCASEST', cat: 'SCASEST 4: Tratamiento y Tiempos', left: '¿Qué tratamiento médico inicial recibe todo paciente con SCASEST y qué fármacos están contraindicados?', right: 'Reposo, monitorización electrocardiográfica continua, oxígeno, opioides (morfina o buprenorfina), antianginosos (nitroglicerina, betabloqueadores o antagonistas de calcio no dihidropiridínicos), aspirina, clopidogrel y atorvastatina; los antiinflamatorios no esteroideos (AINE) están contraindicados.' },
      { id: 'sca26', topic: '3. SCASEST', cat: 'SCASEST 4: Tratamiento y Tiempos', left: '¿Cómo cambia el esquema antitrombótico entre el SCASEST de riesgo bajo y el de riesgo alto?', right: 'Riesgo bajo: no intensificar más allá de aspirina, clopidogrel y heparina (aumenta el sangrado sin beneficio); Riesgo alto: añadir inhibidor de glucoproteína IIb/IIIa en la intervención coronaria, anticoagulación más intensa y angiografía.' },
      { id: 'sca27', topic: '3. SCASEST', cat: 'SCASEST 4: Tratamiento y Tiempos', left: '¿Qué anticoagulante se prefiere en el SCASEST según el manejo conservador, invasivo o intervención percutánea?', right: 'Manejo conservador: heparina, heparina de bajo peso molecular o fondaparinux; Manejo invasivo: heparina o heparina de bajo peso molecular; Intervención percutánea: puede preferirse bivalirudina, pero nunca al inicio.' },
      { id: 'sca28', topic: '3. SCASEST', cat: 'SCASEST 4: Tratamiento y Tiempos', left: '¿Cuándo se recomienda intervención coronaria percutánea frente a cirugía de revascularización en el SCASEST?', right: 'Intervención percutánea: 1 o 2 vasos con lesión culpable, multivaso con puntaje SYNTAX bajo (<13) o sin diabetes; Cirugía: multivaso con SYNTAX alto (≥13) y/o pacientes con diabetes mellitus.' },
      { id: 'sca29', topic: '3. SCASEST', cat: 'SCASEST 4: Tratamiento y Tiempos', left: '¿En qué situaciones se indica cirugía de revascularización sin demoras en el SCASEST, aun bajo inhibidores P2Y12?', right: 'En caso de inestabilidad hemodinámica, isquemia refractaria y/o anatomía coronaria de muy alto riesgo.' },
      { id: 'sca30', topic: '3. SCASEST', cat: 'SCASEST 4: Tratamiento y Tiempos', left: '¿Qué pacientes con SCASEST son candidatos a manejo intervencionista y cuánto antes de cirugía se suspenden antiplaquetarios?', right: 'Riesgo bajo/intermedio con angina recurrente, cambios de electrocardiograma o biomarcadores elevados, intermedio con intervención o cirugía en últimos 6 meses y todos los de riesgo alto; suspender clopidogrel 5 días antes o inhibidor IIb/IIIa 4 horas antes de cirugía.' },
      { id: 'sca31', topic: '3. SCASEST', cat: 'SCASEST 4: Tratamiento y Tiempos', left: '¿Cómo se maneja el SCASEST de riesgo bajo y qué pruebas inductoras de isquemia se emplean?', right: 'Solicitar prueba de esfuerzo, SPECT Tc99 de esfuerzo, ecocardiograma de estrés, resonancia magnética o angiotomografía: sin isquemia significativa → manejo conservador; con isquemia significativa → angiografía electiva.' },
      { id: 'sca32', topic: '3. SCASEST', cat: 'SCASEST 4: Tratamiento y Tiempos', left: '¿Qué criterios definen al SCASEST de riesgo intermedio y en cuánto tiempo debe hacerse la angiografía?', right: 'Diabetes mellitus, depuración de creatinina <60 mL/min, fracción de eyección <40% o insuficiencia cardíaca, angina postinfarto, intervención o cirugía coronaria previa, GRACE 109–139 o TIMI 3–4 → angiografía en ≤72 horas.' },
      { id: 'sca33', topic: '3. SCASEST', cat: 'SCASEST 4: Tratamiento y Tiempos', left: '¿Qué criterios definen al SCASEST de riesgo alto y riesgo muy alto, y cuáles son sus tiempos de angiografía?', right: 'Riesgo alto (infarto sin elevación del ST, cambios dinámicos de ST o T, GRACE ≥140, TIMI 5–7): angiografía precoz en ≤24 horas; Riesgo muy alto (inestabilidad hemodinámica o choque cardiogénico, dolor refractario, arritmias letales o paro, complicaciones mecánicas, elevación intermitente del ST): angiografía inmediata en ≤2 horas.' },

      // ==================== TEMA 4: IAMCEST ====================
      { id: 'iam1', topic: '4. IAMCEST', cat: 'IAMCEST 1: Epidemiología y Definiciones', left: '¿Cómo se definen el infarto agudo de miocardio (IAM) y el infarto con elevación del segmento ST (IAMCEST)?', right: 'IAM: daño miocárdico con troponina mayor al percentil 99 del límite superior de referencia en contexto clínico de isquemia; IAMCEST: síntomas persistentes de isquemia con elevación del segmento ST en al menos 2 derivaciones contiguas.' },
      { id: 'iam2', topic: '4. IAMCEST', cat: 'IAMCEST 1: Epidemiología y Definiciones', left: '¿Cuál es el impacto epidemiológico del infarto y los factores de riesgo más frecuentes en México (RENASCA-IMSS)?', right: 'Primera causa de muerte en hombres (12.6%) y segunda en mujeres (12.6%); mortalidad en RENASCA-IMSS de 14.9%; factores más comunes: hipertensión 60%, tabaquismo 46%, diabetes 45%, síndrome metabólico 39% y dislipidemia 35%.' },
      { id: 'iam3', topic: '4. IAMCEST', cat: 'IAMCEST 1: Epidemiología y Definiciones', left: '¿Qué es una placa vulnerable y cuáles son sus tres tipos histológicos principales?', right: 'Placa susceptible de romperse con alto riesgo de trombosis: 1) Fibroateroma de capa delgada (núcleo lipídico, macrófagos/linfocitos, menos células musculares lisas, metaloproteasas y remodelación expansiva); 2) Placa erosionada rica en proteoglicanos; 3) Placa con nódulo de calcio.' },
      { id: 'iam4', topic: '4. IAMCEST', cat: 'IAMCEST 1: Epidemiología y Definiciones', left: '¿Qué criterios universales definen el daño miocárdico agudo y el infarto agudo de miocardio (tipos 1, 2 y 3)?', right: 'Aumento o caída de troponina con al menos un valor >percentil 99, más al menos 1 de: síntomas isquémicos, cambios nuevos en electrocardiograma, ondas Q patológicas, pérdida de miocardio viable/motilidad por imagen o trombo en angiografía/autopsia.' },
      { id: 'iam5', topic: '4. IAMCEST', cat: 'IAMCEST 1: Epidemiología y Definiciones', left: '¿Qué distingue a los infartos de miocardio tipos 1, 2 y 3 según la Definición Universal?', right: 'Tipo 1: aterotrombosis aguda en la arteria culpable; Tipo 2: desequilibrio entre aporte y demanda de oxígeno sin aterotrombosis; Tipo 3: muerte cardíaca con síntomas e isquemia nueva en electrocardiograma antes de obtener troponinas.' },
      { id: 'iam6', topic: '4. IAMCEST', cat: 'IAMCEST 1: Epidemiología y Definiciones', left: '¿Qué define a los infartos tipos 4a, 4b, 4c y 5, y cuáles son sus umbrales de troponina en las primeras 48 horas?', right: 'Tipo 4a (intervención percutánea): troponina >5 veces el percentil 99; Tipo 4b: trombosis del stent; Tipo 4c: reestenosis; Tipo 5 (cirugía coronaria): troponina >10 veces el percentil 99 (cambio >20% si basal alto), más criterio isquémico, angiográfico o nueva onda Q.' },
      { id: 'iam7', topic: '4. IAMCEST', cat: 'IAMCEST 1: Epidemiología y Definiciones', left: '¿Cuál es el horario de máxima incidencia del IAMCEST, sus desencadenantes y el límite anatómico de irradiación del dolor?', right: 'Máxima incidencia entre las 6:00 a. m. y el mediodía; factor desencadenante en 50% (ejercicio vigoroso, estrés o trastorno médico/quirúrgico); dolor opresivo >20 minutos irradiado a brazo izquierdo, cuello, mandíbula, espalda o nuca, pero nunca por debajo del ombligo.' },
      { id: 'iam8', topic: '4. IAMCEST', cat: 'IAMCEST 1: Epidemiología y Definiciones', left: '¿Con qué frecuencia se presentan los síntomas del IAMCEST en México y qué particularidad existe en mujeres?', right: 'En México: dolor torácico típico 59%, síntomas neurovegetativos 38%, disnea 37% y síncope 5%; hasta 30% tienen síntomas atípicos (cuello, tórax posterior, mandíbula, náusea, debilidad, fatiga), más frecuentes en mujeres, quienes también refieren más dolor en brazo y hombro.' },
      { id: 'iam9', topic: '4. IAMCEST', cat: 'IAMCEST 1: Epidemiología y Definiciones', left: '¿Cómo se clasifica la insuficiencia cardíaca en el IAMCEST según Killip-Kimball y cuál es su mortalidad hospitalaria?', right: 'Clase I: sin signos de insuficiencia cardíaca (6%); Clase II: tercer ruido S3 y estertores basales (17%); Clase III: edema agudo pulmonar (38%); Clase IV: choque cardiogénico (81%).' },

      { id: 'iam10', topic: '4. IAMCEST', cat: 'IAMCEST 2: ECG, Biomarcadores y Forrester', left: '¿Qué alteraciones electrocardiográficas corresponden a isquemia, lesión y necrosis según la capa miocárdica afectada?', right: 'Isquemia (repolarización): onda T alta simétrica (subendocárdica) o negativa simétrica (subepicárdica); Lesión (corriente): segmento ST deprimido (subendocárdica) o elevado (subepicárdica); Necrosis (pérdida de miocardio activo): onda Q patológica (transmural).' },
      { id: 'iam11', topic: '4. IAMCEST', cat: 'IAMCEST 2: ECG, Biomarcadores y Forrester', left: '¿Cuáles son los puntos de corte de elevación del segmento ST en el punto J y los bloqueos equivalentes de IAMCEST?', right: 'Todas las derivaciones excepto V2–V3: ≥0.1 mV (1 mm); En V2–V3: hombres <40 años ≥0.25 mV (2.5 mm), hombres ≥40 años ≥0.20 mV (2.0 mm) y mujeres ≥0.15 mV (1.5 mm); Equivalentes: bloqueo de rama izquierda o derecha nuevo o presumiblemente nuevo.' },
      { id: 'iam12', topic: '4. IAMCEST', cat: 'IAMCEST 2: ECG, Biomarcadores y Forrester', left: '¿Cuáles son los puntos de corte de elevación del ST en derivaciones posteriores (V7–V9) y derechas (V3R–V4R)?', right: 'En V7, V8 y V9 (con espejo de depresión del ST en V1–V3): ≥0.1 mV en hombres <40 años y ≥0.05 mV en el resto; En V3R y V4R: ≥0.1 mV en hombres <30 años y ≥0.05 mV en el resto.' },
      { id: 'iam13', topic: '4. IAMCEST', cat: 'IAMCEST 2: ECG, Biomarcadores y Forrester', left: '¿Qué criterios electrocardiográficos definen al infarto sin elevación del ST y a la onda Q patológica?', right: 'Infarto sin elevación del ST: depresión del ST ≥0.5 mm y/o inversión de onda T ≥1 mm en ≥2 derivaciones contiguas; Onda Q patológica: duración ≥0.04 segundos (1 cuadrito) y profundidad ≥2 mm o ≥25% de la onda R.' },
      { id: 'iam14', topic: '4. IAMCEST', cat: 'IAMCEST 2: ECG, Biomarcadores y Forrester', left: '¿Qué arteria coronaria se afecta en los infartos septal, anterior, apical y lateral (alto y bajo)?', right: 'Septal (V1–V2 con o sin aVR): descendente anterior proximal; Anterior (V3–V4): descendente anterior; Apical (V5–V6): descendente anterior distal, circunfleja o coronaria derecha; Lateral alto (DI, aVL) y lateral bajo (V5–V6): arteria circunfleja izquierda.' },
      { id: 'iam15', topic: '4. IAMCEST', cat: 'IAMCEST 2: ECG, Biomarcadores y Forrester', left: '¿Qué arteria se afecta y qué cuadro clínico caracteriza a los infartos inferior, de ventrículo derecho y posterior?', right: 'Inferior (DII, DIII, aVF): coronaria derecha en 85% (irriga nodos sinoauricular y auriculoventricular → bradicardia/bloqueo) o circunfleja en 8%; Ventrículo derecho (V3R, V4R): coronaria derecha (hipotensión, ingurgitación yugular, pulmones limpios, evitar nitratos); Posterior (V7–V9): coronaria derecha o circunfleja.' },
      { id: 'iam16', topic: '4. IAMCEST', cat: 'IAMCEST 2: ECG, Biomarcadores y Forrester', left: '¿Cuál es la cinética (inicio, pico y normalización) y el protocolo de toma de mioglobina, troponina I/T y CK-MB?', right: 'Mioglobina: inicia 1–2 h, normaliza 24 h; Troponina I/T (estándar de oro): inicia 3–6 h, pico 24–48 h, normaliza 7–10 días; CK-MB: inicia 4–6 h, pico ≈24 h, normaliza 48–72 h (>8–10% de CPK total, útil en reinfarto); Tomas: al ingreso + 3 h + 3 h (repetir c/6 h o 12–24 h si persiste sospecha).' },
      { id: 'iam17', topic: '4. IAMCEST', cat: 'IAMCEST 2: ECG, Biomarcadores y Forrester', left: '¿Cuál es la utilidad del péptido natriurético (BNP), la escala de Zwolle y el ecocardiograma a los 3 meses en el IAMCEST?', right: 'El BNP no diagnostica infarto pero predice fuertemente insuficiencia cardíaca y mortalidad; la escala de Zwolle evalúa el riesgo de hospitalización por insuficiencia cardíaca; repetir ecocardiograma a los 3 meses si hubo alteración de fracción de eyección.' },
      { id: 'iam18', topic: '4. IAMCEST', cat: 'IAMCEST 2: ECG, Biomarcadores y Forrester', left: '¿Cómo se clasifican y manejan los estadios I y II de Forrester (índice cardíaco ≥2.2 L/min/m²)?', right: 'Forrester I (presión capilar pulmonar ≤18 mmHg): gasto adecuado sin congestión → betabloqueadores; Forrester II (presión capilar >18 mmHg): gasto adecuado con congestión pulmonar → diuréticos para reducir precarga.' },
      { id: 'iam19', topic: '4. IAMCEST', cat: 'IAMCEST 2: ECG, Biomarcadores y Forrester', left: '¿Cómo se clasifican y manejan los estadios III y IV de Forrester (índice cardíaco <2.2 L/min/m²)?', right: 'Forrester III (presión capilar ≤18 mmHg, por ejemplo infarto de ventrículo derecho): gasto bajo sin congestión → aumentar precarga con líquidos; Forrester IV (presión capilar >18 mmHg): gasto bajo con congestión → aminas, vasodilatadores y diuréticos.' },

      { id: 'iam20', topic: '4. IAMCEST', cat: 'IAMCEST 3: Reperfusión y Fibrinólisis', left: '¿Cuál es la ventana de reperfusión, el stent de elección y los 6 objetivos de tiempo en el IAMCEST (Cuadro 16)?', right: 'Síntomas ≤12 horas; stent metálico fármaco-activo de nueva generación; ECG ≤10 min; Puerta-balón ≤60 min en centro con hemodinamia o ≤90 min si trasladado (máximo ≤120 min frente a fibrinólisis); Puerta-aguja fibrinólisis ≤10 min; Evaluar fibrinólisis en 60–90 min; Angiografía post-fibrinólisis eficaz en 2–24 horas.' },
      { id: 'iam21', topic: '4. IAMCEST', cat: 'IAMCEST 3: Reperfusión y Fibrinólisis', left: '¿Cuáles son los fibrinolíticos fibrinoespecíficos y la dosis por peso y edad de Tenecteplasa?', right: 'Fibrinoespecíficos: tenecteplasa (elección), alteplasa y reteplasa (máxima eficacia en primeras 2 horas); Tenecteplasa bolo intravenoso: <60 kg 30 mg, 60–69 kg 35 mg, 70–79 kg 40 mg, 80–89 kg 45 mg, ≥90 kg 50 mg (reducir dosis a la mitad en mayores de 75 años).' },
      { id: 'iam22', topic: '4. IAMCEST', cat: 'IAMCEST 3: Reperfusión y Fibrinólisis', left: '¿Qué conducta se sigue tras administrar fibrinólisis según haya o no criterios de reperfusión?', right: 'Si es exitosa (resolución del segmento ST ≥50% a los 60–90 minutos): trasladar para angiografía/intervención coronaria en 2 a 24 horas; Si fracasa (<50% de resolución del ST) o hay inestabilidad hemodinámica/eléctrica: intervención coronaria de rescate inmediata.' },
      { id: 'iam23', topic: '4. IAMCEST', cat: 'IAMCEST 3: Reperfusión y Fibrinólisis', left: '¿Cuáles son las 9 contraindicaciones ABSOLUTAS para la fibrinólisis en el IAMCEST (Cuadro 17)?', right: 'Hemorragia activa, hemorragia intracraneal previa o evento cerebrovascular de origen desconocido en cualquier momento, evento isquémico en últimos 6 meses, daño/neoplasia/malformación del sistema nervioso central, trauma o cirugía craneal en último mes, hemorragia gastrointestinal en último mes, trastorno hemorrágico conocido (salvo menstruación), síndrome aórtico agudo y punciones no compresibles en últimas 24 horas.' },
      { id: 'iam24', topic: '4. IAMCEST', cat: 'IAMCEST 3: Reperfusión y Fibrinólisis', left: '¿Cuáles son las 9 contraindicaciones RELATIVAS para la fibrinólisis en el IAMCEST (Cuadro 17)?', right: 'Ataque isquémico transitorio en últimos 6 meses, anticoagulación oral, embarazo o primera semana posparto, hipertensión refractaria (>180/110 mmHg), enfermedad hepática avanzada, endocarditis infecciosa, úlcera péptica activa, reanimación prolongada o traumática y trombocitopenia <100,000/mcL.' },

      { id: 'iam25', topic: '4. IAMCEST', cat: 'IAMCEST 4: Fármacos, Complicaciones y Rehab', left: '¿Cuál es el esquema de doble antiagregación en intervención coronaria primaria y cómo se rescata el fenómeno "no-reflow"?', right: 'Ácido acetilsalicílico carga 150–300 mg (mantenimiento 75–100 mg/día) más clopidogrel carga 600 mg (mantenimiento 75 mg/día por 12 meses; reducir a 6 meses si alto riesgo de sangrado); en fenómeno "no-reflow" o complicaciones trombóticas usar anti-GPIIb/IIIa como abciximab.' },
      { id: 'iam26', topic: '4. IAMCEST', cat: 'IAMCEST 4: Fármacos, Complicaciones y Rehab', left: '¿Qué anticoagulante se indica en la intervención coronaria primaria frente a la fibrinólisis en el IAMCEST?', right: 'En intervención primaria: heparina no fraccionada rutinaria, bivalirudina si hay trombocitopenia inducida por heparina, o enoxaparina (no anticoagular después salvo fibrilación auricular, válvula mecánica o trombo); En fibrinólisis (hasta 8 días): enoxaparina 1 mg/kg subcutánea c/12 h, heparina no fraccionada (bolo 60 U/kg máx 4,000 U + 12 U/kg/h máx 1,000 U/h) o fondaparinux con estreptoquinasa.' },
      { id: 'iam27', topic: '4. IAMCEST', cat: 'IAMCEST 4: Fármacos, Complicaciones y Rehab', left: '¿Cuándo debe administrarse oxígeno suplementario en el IAMCEST y qué pasa si se da sin hipoxemia?', right: 'Solo cuando la saturación de oxígeno es <90% o la PaO₂ <60 mmHg; administrarlo sin hipoxemia aumenta el daño miocárdico temprano y provoca un tamaño de infarto mayor a los 6 meses.' },
      { id: 'iam28', topic: '4. IAMCEST', cat: 'IAMCEST 4: Fármacos, Complicaciones y Rehab', left: '¿Qué indicaciones y contraindicaciones tienen los diuréticos, nitroglicerina y betabloqueadores en el IAMCEST?', right: 'Diuréticos de asa: congestión por insuficiencia cardíaca; Nitroglicerina intravenosa: insuficiencia cardíaca asociada al infarto, contraindicada si presión sistólica <90 mmHg o infarto de ventrículo derecho; Betabloqueadores orales: en insuficiencia cardíaca o fracción de eyección ≤40% (evitar vía intravenosa en hipotensión, insuficiencia aguda, bloqueo o bradicardia grave).' },
      { id: 'iam29', topic: '4. IAMCEST', cat: 'IAMCEST 4: Fármacos, Complicaciones y Rehab', left: '¿Qué indicaciones tienen las estatinas, IECA/ARA-II y antagonistas de mineralocorticoides en el IAMCEST?', right: 'Atorvastatina 80 mg lo antes posible para reducir "no-reflow" (meta LDL <55 mg/dL o baja ≥50%); IECA (o valsartán) en primeras 24 horas en insuficiencia cardíaca, disfunción sistólica, diabetes o infarto anterior; Antagonista de mineralocorticoides si fracción de eyección ≤40% con insuficiencia cardíaca o diabetes ya con IECA y betabloqueador (sin falla renal ni hiperkalemia).' },
      { id: 'iam30', topic: '4. IAMCEST', cat: 'IAMCEST 4: Fármacos, Complicaciones y Rehab', left: '¿Cómo se previenen y tratan las principales arritmias que complican al IAMCEST?', right: 'Reperfusión oportuna y corrección hidroelectrolítica; en fibrilación auricular con isquemia o taquicardia ventricular: cardioversión eléctrica o amiodarona intravenosa (sin hipotensión); en bradicardia inestable o bloqueo auriculoventricular de alto grado: atropina intravenosa y marcapaso temporal si no responde.' },
      { id: 'iam31', topic: '4. IAMCEST', cat: 'IAMCEST 4: Fármacos, Complicaciones y Rehab', left: '¿Cuándo ocurren las complicaciones mecánicas del IAMCEST, cuáles son sus factores de riesgo, los 3 tipos y su manejo?', right: 'Entre 48 horas y 14 días (factores: edad avanzada, mujer, hipertensión, primer infarto, cara anterior, AINE/esteroides, fibrinólisis >12 h); Tipos: rotura de pared libre (<1%), insuficiencia mitral aguda por músculo papilar (0.1–0.9%) y rotura del tabique interventricular (0.2%); confirmar con ecocardiograma y tratar con cirugía de elección.' },
      { id: 'iam32', topic: '4. IAMCEST', cat: 'IAMCEST 4: Fármacos, Complicaciones y Rehab', left: '¿Cuáles son las metas de prevención secundaria farmacológica y de estilo de vida tras un IAMCEST (Cuadro 19)?', right: 'Aspirina 100–150 mg/día indefinida + inhibidor P2Y12 (stent metálico ≥1 mes, stent liberador de drogas ≥1 año); si fibrilación auricular anticoagular con CHA₂DS₂-VASc ≥2 (aspirina si ≤1); presión <130/80 mmHg, LDL <55 mg/dL, no-HDL <85 mg/dL, IMC 18.5–24.9 (bajar 3–10% peso), HbA1c <7%, ≥150 min/sem de ejercicio y >10,000 pasos/día.' },
      { id: 'iam33', topic: '4. IAMCEST', cat: 'IAMCEST 4: Fármacos, Complicaciones y Rehab', left: '¿Cuáles son las 3 fases de la rehabilitación cardíaca y cómo se prescribe el ejercicio en la Fase 2?', right: 'Fase 1: atención hospitalaria; Fase 2: ambulatoria multidisciplinaria (2A: periodo temprano post-egreso; 2B: entrenamiento); Fase 3: mantenimiento a largo plazo; en Fase 2 se guía con prueba de esfuerzo, usando escala de Borg si hay arritmia, trasplante cardíaco o uso de betabloqueadores o digitálicos.' },

      // ==================== CARDIOLOGÍA 2 — MÓDULO I: ARRITMIAS Y TRASTORNOS DE LA CONDUCCIÓN (1–48) ====================
      // 1. Generalidades y Bradiarritmias: Definición y Abordaje (Preguntas 1–7)
      { id: 'c2_1', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '1. Generalidades y Bradiarritmias (P1–7)', left: '¿Cómo se clasifican las arritmias supraventriculares y qué criterio anatómico las define?', right: 'Se clasifican en bradiarritmias y taquiarritmias, y abarcan cualquier ritmo originado proximal a la bifurcación del haz de His en sus ramas derecha e izquierda.' },
      { id: 'c2_2', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '1. Generalidades y Bradiarritmias (P1–7)', left: '¿Cómo se define bradiarritmia y cuál es su diferencia con la bradicardia clásica?', right: 'Bradiarritmia es cualquier frecuencia cardíaca menor a 50 latidos por minuto (< 50 lpm); la bradicardia clásica se define como una frecuencia cardíaca < 60 lpm.' },
      { id: 'c2_3', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '1. Generalidades y Bradiarritmias (P1–7)', left: '¿Cuáles son los 5 pasos iniciales de qué hacer ante una bradiarritmia?', right: '1) Identificar al paciente, 2) Revisar la frecuencia cardíaca (< 50 lpm), 3) Identificar el tipo de bloqueo, 4) Evaluar si está inestable y 5) Tratar inmediatamente.' },
      { id: 'c2_4', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '1. Generalidades y Bradiarritmias (P1–7)', left: '¿Cuál es la regla clave ante una bradicardia sintomática e inestable?', right: 'Bradicardia sintomática e inestable (< 50 lpm con síntomas) = tratar de inmediato.' },
      { id: 'c2_5', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '1. Generalidades y Bradiarritmias (P1–7)', left: '¿Cuáles son los 5 signos de inestabilidad (compromiso cardiopulmonar) en bradiarritmias?', right: 'Hipotensión, alteración aguda del estado mental, signos de choque, molestia o dolor torácico isquémico e insuficiencia cardíaca aguda.' },
      { id: 'c2_6', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '1. Generalidades y Bradiarritmias (P1–7)', left: '¿Cuál es el algoritmo general de manejo ante una FC < 50 lpm según la estabilidad?', right: 'Si SÍ está inestable: ir a manejo de bradicardia inestable. Si NO está inestable: ir a manejo de bradicardia estable (monitorizar, buscar y corregir la causa).' },
      { id: 'c2_7', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '1. Generalidades y Bradiarritmias (P1–7)', left: '¿Qué medidas diagnósticas y terapéutica general aplican en las bradiarritmias?', right: 'Diagnóstico: electrocardiograma (ECG), monitorización Holter, monitorización de asa prolongada y estudio electrofisiológico. Tratamiento obligatorio: siempre incluye el retiro de los factores precipitantes (buscar y tratar la causa reversible).' },

      // 2. Manejo de Bradicardia Inestable, Estable y Causas Reversibles (Preguntas 8–13)
      { id: 'c2_8', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '2. Manejo Bradicardia y Causas (P8–13)', left: '¿Cuáles son las medidas iniciales (ABCD) en todo paciente con bradicardia inestable?', right: 'A (Vía aérea): permeable; B (Respiración): oxígeno si hay hipoxemia; C (Circulación): monitor cardíaco y presión arterial, acceso IV; D (Diagnóstico): tomar ECG de 12 derivaciones (si no retrasa el tratamiento).' },
      { id: 'c2_9', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '2. Manejo Bradicardia y Causas (P8–13)', left: '¿Qué es la atropina, cuál es su mecanismo de acción y su posología exacta?', right: 'Mecanismo: antagonista competitivo de receptores muscarínicos M2 que bloquea el efecto vagal (acetilcolina) sobre el nodo SA y AV, aumentando el automatismo sinusal, la conducción AV y la frecuencia cardíaca. Dosis: 1 mg IV en bolo, repetir cada 3 a 5 minutos, dosis máxima de 3 mg. Conducta: si responde → vigilar y tratar causa; si no responde → marcapasos o fármacos alternativos.' },
      { id: 'c2_10', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '2. Manejo Bradicardia y Causas (P8–13)', left: '¿Cuándo se indica marcapasos de forma TEMPRANA, cuál es su secuencia y qué advertencia aplica?', right: 'Indicaciones tempranas: Mobitz II, bloqueo AV avanzado, bloqueo AV completo (3.º grado) y bradicardia inestable refractaria a atropina. Secuencia: 1) Marcapasos transcutáneo (puente), 2) Marcapasos transvenoso temporal si persiste inestabilidad y 3) Valorar marcapasos permanente. Advertencia: en Mobitz II, bloqueo AV avanzado y completo no confiar en atropina; preparar marcapasos desde el inicio.' },
      { id: 'c2_11', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '2. Manejo Bradicardia y Causas (P8–13)', left: '¿Cuáles son los fármacos alternativos en infusión continua y su mecanismo de acción exacto?', right: 'Dopamina (agonista D1/beta-1): 5–20 mcg/kg/min IV en infusión continua (aumenta automatismo sinusal, conducción AV, contractilidad y PA). Adrenalina/epinefrina (agonista alfa y beta): 2–10 mcg/min IV en infusión continua (estimula receptores beta-1 en nodo SA/AV y alfa-1 vasoconstrictores).' },
      { id: 'c2_12', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '2. Manejo Bradicardia y Causas (P8–13)', left: '¿En qué consiste el manejo de la bradicardia estable y qué advertencia aplica en bloqueos altos?', right: 'Manejo: monitorización y observación, ECG seriados, Holter/monitorización ambulatoria si los síntomas son intermitentes, buscar y corregir la causa, y valoración por cardiología/electrofisiología. Advertencia: "estable" no significa mandarlo a casa; un Mobitz II, bloqueo AV avanzado o completo sigue siendo de alto riesgo y requiere evaluación urgente.' },
      { id: 'c2_13', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '2. Manejo Bradicardia y Causas (P8–13)', left: '¿Cuáles son las causas reversibles de bradicardia por categoría?', right: 'Cardíacas: isquemia miocárdica, IAM, miocarditis, enfermedad degenerativa, cirugía cardíaca, valvulopatías (EAo) e infiltrativas (amiloidosis, sarcoidosis). Fármacos/tóxicos: betabloqueadores, verapamilo, diltiazem, digoxina, amiodarona, ivabradina, litio, opioides, clonidina. Hipoxia: EPOC, neumonía, embolia pulmonar, apnea del sueño. Electrolíticas: hiperpotasemia, hipercalcemia, hipomagnesemia. Otras: hipotiroidismo, hipotermia, PIC elevada, Coxsackie o Lyme.' },

      // 3. Disfunción del Nodo Sinusal (DNS) e Hipersensibilidad del Seno Carotídeo (Preguntas 14–21)
      { id: 'c2_14', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '3. Disfunción Nodo Sinusal y Seno Carotídeo (P14–21)', left: '¿Qué caracteriza a la bradicardia sinusal fisiológica y cuándo es frecuente?', right: 'Ritmo sinusal lento con FC < 60 lpm, frecuente durante el sueño y en atletas entrenados.' },
      { id: 'c2_15', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '3. Disfunción Nodo Sinusal y Seno Carotídeo (P14–21)', left: '¿Cómo regula el sistema nervioso autónomo la frecuencia del nódulo sinoauricular (SA)?', right: 'El parasimpático (nervios vagos) disminuye la frecuencia del marcapasos SA y domina en reposo; el simpático y las catecolaminas de la médula suprarrenal aumentan la frecuencia sinusal durante el ejercicio y el estrés.' },
      { id: 'c2_16', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '3. Disfunción Nodo Sinusal y Seno Carotídeo (P14–21)', left: '¿Cómo se define la Disfunción del Nodo Sinusal (DNS), cuál es su causa más común y qué otras etiologías la provocan?', right: 'Definición: anomalías en el ECG asociadas con signos y síntomas clínicos por disfunción del nodo SA que provoca formación o propagación inadecuada del impulso auricular (trastornos de automaticidad, conducción o ambos). Causa más común: senescencia y fibrosis del nódulo sinusal y miocardio auricular circundante. Otras causas: medicamentos, toxinas y enfermedades sistémicas.' },
      { id: 'c2_17', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '3. Disfunción Nodo Sinusal y Seno Carotídeo (P14–21)', left: '¿Cuál es el perfil clínico, historia natural y riesgos evolutivos de la DNS?', right: 'Perfil: pacientes mayores (7.ª u 8.ª década de la vida) con enfermedades comórbidas frecuentes. Historia natural y pronóstico: trastornos intermitentes pero progresivos que evolucionan con el tiempo, asociándose con mayor probabilidad de eventos tromboembólicos, tasas más altas de otros eventos cardiovasculares y mayor mortalidad.' },
      { id: 'c2_18', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '3. Disfunción Nodo Sinusal y Seno Carotídeo (P14–21)', left: '¿Cuáles son los síntomas y los hallazgos típicos en el ECG de la DNS?', right: 'Síntomas (inespecíficos, intermitentes y progresivos): fatiga, mareos, palpitaciones, presíncope, síncope, disnea de esfuerzo o angina. Hallazgos en ECG (5 alteraciones): 1) Bradicardia sinusal (o inapropiada), 2) Pausas, paro o arresto sinusal, 3) Bloqueo de salida SA, 4) Incompetencia cronotrópica y 5) Síndrome bradicardia-taquicardia.' },
      { id: 'c2_19', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '3. Disfunción Nodo Sinusal y Seno Carotídeo (P14–21)', left: '¿Cuál es la clave diagnóstica de la DNS y qué estudio se indica si el ECG inicial no es diagnóstico?', right: 'No existen criterios estandarizados; las pistas iniciales vienen de la historia clínica y la clave es establecer una correlación entre los síntomas y el ritmo subyacente en el momento exacto de los síntomas. Si el ECG inicial no es diagnóstico, se indica monitorización ambulatoria del ECG (monitor de eventos ambulatorios durante 2 a 4 semanas).' },
      { id: 'c2_20', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '3. Disfunción Nodo Sinusal y Seno Carotídeo (P14–21)', left: '¿Cuándo se indica marcapasos permanente en la DNS y de qué depende su selección y programación?', right: 'Asintomáticos: no se requiere marcapasos permanente. Sintomáticos con bradicardia documentada: se recomienda implantación de marcapasos permanente. Selección y programación dependen de 4 factores: 1) Anomalías de conducción AV, 2) Arritmias auriculares, 3) Deseo de mantener sincronía AV y 4) Necesidad de respuesta en frecuencia.' },
      { id: 'c2_21', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '3. Disfunción Nodo Sinusal y Seno Carotídeo (P14–21)', left: '¿Qué es la hipersensibilidad del seno carotídeo y cuál es su mecanismo fisiopatológico?', right: 'Respuesta exagerada del reflejo del seno carotídeo ante su estimulación: produce aumento de la descarga vagal (disminuye frecuencia cardíaca) y disminución del tono simpático (vasodilatación que disminuye presión arterial).' },

      // 4. Bloqueo Auriculoventricular (BAV) y Bloqueos de Rama (Preguntas 22–26)
      { id: 'c2_22', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '4. Bloqueo AV y Bloqueos de Rama (P22–26)', left: '¿Qué es el bloqueo auriculoventricular (BAV) y qué caracteriza a cada uno de sus 3 grados?', right: '1.º grado: todas las P conducen con PR > 0.20 s (200 ms) sin bloqueo; origen nodo AV; benigno. 2.º grado Mobitz I (Wenckebach): el PR se alarga progresivamente hasta que una P no conduce; origen nodo AV (tono vagal); buen pronóstico. 2.º grado Mobitz II: PR constante antes y después de una P bloqueada súbitamente; origen His-Purkinje (infranodal); mal pronóstico. 3.º grado (completo): ninguna P conduce, disociación AV completa con escape ventricular; grave, requiere marcapasos.' },
      { id: 'c2_23', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '4. Bloqueo AV y Bloqueos de Rama (P22–26)', left: '¿Cómo es la epidemiología, factores de riesgo y etiología del BAV?', right: 'Prevalencia: 1.º grado hasta 5% en adultos mayores; 2.º grado 2.7% en cardiopatía estructural; 3.º grado raro (> 50 años; congénito 1 en 15,000 a 25,000 nacimientos). Factores de riesgo: cardiopatía isquémica, valvulopatías, betabloqueadores e hipercalemia. Etiología: adquirida (fibrosis progresiva, isquemia, valvulopatías), congénita o inducida (digoxina, trastornos metabólicos).' },
      { id: 'c2_24', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '4. Bloqueo AV y Bloqueos de Rama (P22–26)', left: '¿Cuál es la clínica, diagnóstico y tratamiento del BAV?', right: 'Clínica: asintomáticos o fatiga, mareos, síncope, IC o ritmo idioventricular. Diagnóstico: ECG, Holter y estudios electrofisiológicos. Manejo: tratar condiciones subyacentes (hipercalemia) y suspender fármacos causales. Marcapasos permanente: BAV de 3.º grado sintomático, Mobitz II o avanzado con síntomas, bradicardia severa (< 40 lpm) o asistolia prolongada (> 3 segundos).' },
      { id: 'c2_25', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '4. Bloqueo AV y Bloqueos de Rama (P22–26)', left: '¿Cuál es el pronóstico, criterios de referencia por nivel y prevención del BAV?', right: 'Pronóstico: adquirido asociado a IAM tiene peor pronóstico; congénito generalmente benigno pero puede evolucionar a IC o muerte súbita sin tratamiento. Referencia: estable → segundo nivel; inestable o sintomático → manejo inmediato (marcapasos temporal); complicaciones o marcapasos avanzado → tercer nivel. Prevención: control de riesgo CV, monitoreo periódico con ECG y uso cauteloso de fármacos.' },
      { id: 'c2_26', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '4. Bloqueo AV y Bloqueos de Rama (P22–26)', left: '¿Cuáles son los criterios electrocardiográficos del Bloqueo de Rama Derecha (BRD) y Bloqueo de Rama Izquierda (BRI)?', right: 'BRD: eje normal o indeterminado, QRS ≥ 0.12 s (120 ms), patrón rsR\' en V1–V2 ("orejas de conejo") y onda S ancha y empastada en DI, aVL y V6. BRI: QRS ≥ 0.12 s (120 ms), ausencia de ondas q normales en DI, aVL, V5–V6, onda R ancha, mellada o empastada en DI, aVL, V5–V6, y complejo QS o rS ancho negativo en V1–V2.' },

      // 5. Taquiarritmias: Definición, Clasificación por QRS y Algoritmo de Manejo (Preguntas 27–30)
      { id: 'c2_27', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '5. Taquiarritmias y Algoritmo QRS (P27–30)', left: '¿Cómo se definen electrocardiográficamente y clínicamente las taquiarritmias y cuáles son sus causas?', right: 'Definición: ≥ 3 latidos con FC > 100 lpm (clínicamente significativa ≥ 150 lpm); complejos QRS regulares o irregulares, usualmente estrechos (amplios si bloqueo de rama o vía accesoria). Causas: dilatación auricular, IAM, embolismo pulmonar, estados inflamatorios agudos o crónicos, o cicatrices quirúrgicas auriculares/pericárdicas.' },
      { id: 'c2_28', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '5. Taquiarritmias y Algoritmo QRS (P27–30)', left: '¿Qué ritmos pertenecen a QRS estrecho (< 0.12 s) vs. QRS ancho (≥ 0.12 s) y cuáles son sus reglas?', right: 'QRS estrecho (< 0.12 s = origen supraventricular): taquicardia sinusal, fibrilación auricular, flúter auricular, TSV y taquicardia auricular. QRS ancho (≥ 0.12 s = tratar como TV hasta demostrar lo contrario): TV monomórfica, TV polimórfica, Torsades de pointes, TSV con aberrancia y taquicardia de complejo ancho de origen incierto.' },
      { id: 'c2_29', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '5. Taquiarritmias y Algoritmo QRS (P27–30)', left: '¿Cuál es el manejo de la taquiarritmia INESTABLE (FC ≥ 150 lpm con hipotensión, alteración mental, choque, isquemia o IC aguda) y qué contraindicaciones existen?', right: 'Medidas: ABCD + monitor + TA + SpO2 + acceso IV + ECG 12 derivaciones. Con pulso: cardioversión eléctrica sincronizada (excepción: TV polimórfica / Torsades → descarga no sincronizada). Sin pulso (paro): FV/TV sin pulso → desfibrilación + RCP; AESP/asistolia → RCP + adrenalina. 4 contraindicaciones de cardioversión sincronizada: 1) Taquicardia sinusal, 2) TSV sin pulso, 3) TV polimórfica con QRS ancho (Torsades) y 4) Fibrilación ventricular.' },
      { id: 'c2_30', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '5. Taquiarritmias y Algoritmo QRS (P27–30)', left: '¿Cuál es el algoritmo de manejo de la taquiarritmia ESTABLE según el ancho y regularidad del QRS?', right: 'QRS estrecho (< 0.12 s) y REGULAR: 1) Maniobras vagales, 2) Adenosina 6 mg IV bolo rápido + lavado SS → si falla, 12 mg IV. QRS estrecho e IRREGULAR (FA, flúter variable, TAM): betabloqueador, diltiazem o verapamilo. QRS ancho (≥ 0.12 s) REGULAR + MONOMÓRFICO: considerar adenosina + antiarrítmico (procainamida, amiodarona o sotalol) + experto. QRS ancho IRREGULAR/POLIMÓRFICO: NO adenosina, pensar en Torsades de pointes.' },

      // 6. Taquicardias Auriculares, Supraventriculares (TSV) y Flutter Auricular (Preguntas 31–34)
      { id: 'c2_31', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '6. Taquicardias Auriculares, TSV y Flutter (P31–34)', left: '¿Qué caracteriza a la taquicardia sinusal, taquicardia sinusal inapropiada y reentrada del nodo sinusal?', right: 'Taquicardia sinusal: incremento gradual de FC (> 100 lpm, suele no superar 150 lpm), RR regular, P antes de cada QRS (positiva DI, DII, DIII, aVF; negativa aVR), eje P 0° a +90°, respuesta fisiológica a ejercicio, ansiedad, fiebre, dolor, hipovolemia, hipotensión, anemia, hipoxia, tirotoxicosis, falla cardíaca, cocaína/cafeína → tratar la causa (betabloqueadores si sintomática). Inapropiada: estrés mínimo. Reentrada del nodo sinusal: inicio y fin abruptos con P idéntica a sinusal → betabloqueadores.' },
      { id: 'c2_32', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '6. Taquicardias Auriculares, TSV y Flutter (P31–34)', left: '¿Qué caracteriza a la Taquicardia Supraventricular (TSV)?', right: 'Origen por encima de los ventrículos; mecanismos de automatismo anormal, actividad desencadenada y reentrada (hasta 60%); duración paroxística (inicio y fin súbitos) o permanente; más frecuente en edades avanzadas; clínica con palpitaciones súbitas, mareo/presíncope, disnea, dolor torácico, síncope y "sensación de muerte".' },
      { id: 'c2_33', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '6. Taquicardias Auriculares, TSV y Flutter (P31–34)', left: '¿Qué es el flutter auricular, su epidemiología, factores de riesgo y mecanismos típico vs. atípico?', right: 'Definición y ECG: circuito de reentrada auricular rápida y regular (240 a 350 lpm) con ondas en "dientes de sierra" (ondas F) sin línea isoeléctrica, negativas en II, III y aVF en el típico; más común en hombres > 60 años (FR: HTA, IC, cardiopatía estructural, EPOC, alcohol). Típico: macro-reentrada en aurícula derecha dependiente del istmo cavotricuspídeo. Atípico: circuitos en aurícula derecha o izquierda por cicatrices quirúrgicas o ablaciones previas.' },
      { id: 'c2_34', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '6. Taquicardias Auriculares, TSV y Flutter (P31–34)', left: '¿Cuál es la clínica, diagnóstico y manejo completo del flutter auricular?', right: 'Clínica: palpitaciones rápidas regulares, disnea, fatiga, intolerancia al ejercicio, síncope o hipotensión. Diagnóstico: ECG (vagales o adenosina resaltan ondas F), ETT/ETE antes de cardioversión y estudio electrofisiológico. Tratamiento: control de frecuencia con betabloqueadores (metoprolol), verapamilo, diltiazem o digoxina en IC; cardioversión eléctrica (> 90% éxito) o ibutilida/dofetilida (vigilar Torsades); ablación del istmo cavotricuspídeo es elección en recurrentes (~95% éxito); anticoagulación según CHA₂DS₂-VASc (ACOD o warfarina).' },

      // 7. Fibrilación Auricular (FA) y Clasificación Antiarrítmica (Preguntas 35–40)
      { id: 'c2_35', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '7. Fibrilación Auricular y Antiarrítmicos (P35–40)', left: '¿Qué es la fibrilación auricular (FA), su epidemiología, fisiopatología y hallazgos en ECG?', right: 'Definición: taquiarritmia supraventricular sostenida más común; activación auricular rápida y desorganizada (> 300 lpm) sin contracción efectiva. ECG: ausencia de ondas P, ondas fibrilatorias irregulares (ondas f), intervalo RR irregularmente irregular y QRS generalmente estrecho. Epidemiología: 1–2% general y hasta 15% en > 80 años (FR: HTA, DM, IC, cardiopatía estructural). Fisiopatología: automatismo en venas pulmonares + múltiples reentradas + remodelado y fibrosis.' },
      { id: 'c2_36', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '7. Fibrilación Auricular y Antiarrítmicos (P35–40)', left: '¿Cuáles son las clasificaciones clínica/temporal y sintomática (EHRA) de la FA, y su abordaje diagnóstico?', right: 'Temporal (5 tipos): Primer diagnóstico, Paroxística (≤ 7 días), Persistente (> 7 días), Persistente de larga duración (≥ 12 meses) y Permanente. Escala EHRA: I (sin síntomas), II (leves, actividad diaria normal no afectada), III (graves/importantes, actividad afectada), IV (incapacitantes). Principal complicación: tromboembolismo/EVC (trombo en orejuela auricular izquierda). Diagnóstico: ECG, Holter, ETT y ETE (descarta trombos en orejuela antes de cardioversión).' },
      { id: 'c2_37', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '7. Fibrilación Auricular y Antiarrítmicos (P35–40)', left: '¿Cómo se realiza el control del ritmo y la cardioversión según duración e inestabilidad en la FA?', right: 'FA inestable: cardioversión eléctrica sincronizada inmediata + sedación y analgesia + heparina + control de frecuencia. FA estable < 48 horas: con anormalidad estructural → amiodarona IV; sin anormalidad estructural → flecainida, propafenona o ibutilida IV (vigilar QT/Torsades) + anticoagulación 4 semanas. FA > 48 horas o desconocida: ETE sin trombos → cardioversión + 4 semanas AC; con trombos o sin ETE → anticoagular ≥ 3 semanas antes y ≥ 4 semanas después.' },
      { id: 'c2_38', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '7. Fibrilación Auricular y Antiarrítmicos (P35–40)', left: '¿Cuál es la meta del control de frecuencia en FA y cómo se eligen los fármacos según el perfil del paciente (Figura 8)?', right: 'Meta: frecuencia ventricular promedio en reposo < 110 lpm. Inactivo/sedentario: digitálicos (digoxina). Activo sin enfermedad o con HTA: betabloqueadores (metoprolol, bisoprolol), diltiazem, verapamilo o digitálicos. Insuficiencia cardíaca (FEVI baja): betabloqueadores o digitálicos (evitar BCC no DHP). EPOC: diltiazem, verapamilo, digitálicos o betabloqueadores selectivos.' },
      { id: 'c2_39', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '7. Fibrilación Auricular y Antiarrítmicos (P35–40)', left: '¿Cómo se estratifica el riesgo tromboembólico (CHA₂DS₂-VASc) y hemorrágico (HAS-BLED) y cómo se anticoagula la FA?', right: 'CHA₂DS₂-VASc: falla cardíaca (1), HTA (1), edad ≥ 75 (2), DM (1), EVC/AIT/tromboembolismo previo (2), enfermedad vascular (1), edad 65–74 (1), sexo femenino (1). Conducta: 0 pts → no AC; 1 pt → considerar si no es solo mujer y sin riesgo sangrado; ≥ 2 pts → AC recomendada (aspirina NO sustituye AC). Preferir ACOD (apixabán, rivaroxabán, dabigatrán, edoxabán); usar warfarina (INR 2–3) si prótesis mecánica o estenosis mitral reumática moderada-grave (si contraindicada: oclusor aurícula izquierda). HAS-BLED ≥ 3 = riesgo sangrado elevado.' },
      { id: 'c2_40', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '7. Fibrilación Auricular y Antiarrítmicos (P35–40)', left: '¿Cómo se clasifican los fármacos antiarrítmicos según Vaughan Williams?', right: 'Clase IA (Na+, ↑ PR, QRS y QT): disopiramida, procainamida, quinidina. Clase IB (Na+, ↓ QT): lidocaína, mexiletina. Clase IC (Na+, ↑↑ PR y QRS): propafenona, flecainida. Clase II (betabloqueadores fase 4): metoprolol, atenolol, propranolol, bisoprolol, carvedilol, esmolol. Clase III (K+ fase 3, ↑ QT): amiodarona, sotalol, dofetilida, ibutilida. Clase IV (Ca2+ no DHP fases 2 y 3 nodo AV): verapamilo, diltiazem.' },

      // 8. Síndromes de Preexcitación y Síndrome de Wolff-Parkinson-White (WPW) (Preguntas 41–44)
      { id: 'c2_41', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '8. Preexcitación y WPW (P41–44)', left: '¿Qué son los síndromes de preexcitación ventricular y qué vías accesorias existen?', right: 'Activación ventricular precoz a través de una vía alterna al sistema de conducción normal por fracaso embriológico en la separación fibrosa entre aurículas y ventrículos: Haz de Kent (WPW, conducción anterógrada y retrógrada "atajo eléctrico"), Vía de Mahaim (solo anterógrada A → V) y Vía oculta (solo retrógrada A ← V).' },
      { id: 'c2_42', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '8. Preexcitación y WPW (P41–44)', left: '¿Cuál es la epidemiología, factores de riesgo y tríada electrocardiográfica del WPW?', right: 'Epidemiología y riesgo: prevalencia de 1 a 3 por cada 1,000 habitantes, más frecuente en varones; factores de riesgo: antecedentes familiares de arritmias, enfermedad de Ebstein y uso de digoxina. Tríada clásica en ritmo sinusal: 1) Intervalo PR corto (< 0.12 s en adultos, < 0.09 s en niños), 2) Onda delta y 3) QRS ancho (≥ 0.12 s) con alteraciones secundarias de la repolarización.' },
      { id: 'c2_43', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '8. Preexcitación y WPW (P41–44)', left: '¿Cómo se diferencian las taquicardias ortodrómica y antidrómica en el WPW y cuál es el mecanismo de muerte súbita?', right: 'Taquicardia reentrante AV ortodrómica (80%, más frecuente): baja por el nodo AV y sube por la vía accesoria → QRS estrecho. Taquicardia reentrante AV antidrómica (menos frecuente): baja por la vía accesoria y sube por el nodo AV → QRS ancho. Riesgo acumulativo de muerte súbita sin tratamiento de hasta 4%: en FA + WPW + conducción anterógrada, la conducción rápida por la vía accesoria degenera en fibrilación ventricular.' },
      { id: 'c2_44', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '8. Preexcitación y WPW (P41–44)', left: '¿Cómo se diagnostica, estratifica y trata el WPW (agudo y definitivo)?', right: 'Diagnóstico: ECG, ETT, Holter, prueba de esfuerzo y estudio electrofisiológico. Datos de mal pronóstico: periodo refractario accesorio ≤ 250 ms, vías múltiples, FA, taquicardia > 240/min, cardiopatías asociadas o taquicardias inducibles. Definitivo: ablación con catéter (éxito ≥ 95%; urgente si sintomático con mal pronóstico, electiva si sin mal pronóstico o periodo refractario ≤ 250 ms). Agudo: TSV ortodrómica → vagales o adenosina; FA preexcitada inestable → cardioversión sincronizada; FA preexcitada estable → procainamida IV o amiodarona. Contraindicación absoluta: NUNCA dar bloqueadores nodales AV (adenosina, vagales, digoxina, verapamilo, diltiazem) en FA preexcitada.' },

      // 9. Arritmias Ventriculares (Extrasístoles, TV, Torsades y FV) (Preguntas 45–48)
      { id: 'c2_45', mission: 'C2', topic: 'Módulo I: Arritmias', cat: '9. Arritmias Ventriculares (P45–48)', left: '¿Qué son las arritmias ventriculares, su incidencia de muerte súbita, factores de riesgo y mecanismos?', right: 'Espectro: desde extrasístoles hasta TV sostenida y FV; incidencia anual de muerte súbita cardíaca de 1–2 casos por 1,000 personas. FR: cardiopatía isquémica, miocardiopatías, síndrome de Brugada, síndrome de QT largo, antecedentes familiares de MSC, desequilibrios electrolíticos y toxicidad por fármacos. 3 mecanismos: 1) Reentrada (más frecuente; cicatriz de IAM), 2) Automatismo anómalo y 3) Actividad desencadenada (postpotenciales por aumento de Ca2+ intracelular).' },
